name: Lint Markdown

on:
  push:
    paths:
      - 'content/**'
      - '.markdownlint.json'
      - '.github/workflows/lint-markdown.yml'
  pull_request:
    paths:
      - 'content/**'
      - '.markdownlint.json'
      - '.github/workflows/lint-markdown.yml'

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run markdownlint (no bloqueante)
        run: |
          # No falla el job: los errores se muestran como warnings inline en el PR.
          # Anotaciones en vez de comentario: funcionan en PRs de forks sin permisos de escritura.
          if npx -y markdownlint-cli2@0.24.1 "content/**/*.md" --config .markdownlint.json > lint.txt 2>&1; then
            echo "### markdownlint: sin errores :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          else
            sed -nE 's/^(.+\.md):([0-9]+)(:[0-9]+)? error (.*)$/::warning file=\1,line=\2::\4/p' lint.txt
            {
              echo "### markdownlint: hay errores :warning:"
              echo '```'
              grep ' error ' lint.txt
              echo '```'
              echo 'Para corregir localmente: `make lint-fix`'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat lint.txt
