name: Lint Markdown

on:
  push:
    paths:
      - 'content/**'
  pull_request:
    paths:
      - 'content/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use project Node.js version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run markdownlint
        id: lint
        run: |
          if npm run lint:md > md-lint-output.txt 2>&1; then
            echo "had_errors=false" >> "$GITHUB_OUTPUT"
          else
            echo "had_errors=true" >> "$GITHUB_OUTPUT"
          fi
          cat md-lint-output.txt

      - name: Post or update PR comment when lint errors exist
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && steps.lint.outputs.had_errors == 'true' }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('md-lint-output.txt', 'utf8');
            const maxLen = 6500;
            const trimmed = summary.length > maxLen ? summary.slice(0, maxLen) + '\n\n_(truncated)_': summary;
            const body = `:warning: **markdownlint** found issues in the repository content files. Here are the first lines (truncated if long):\n\n${trimmed}\n\n---\nRun locally: \`npm run lint:md\` or \`npm run lint:md:fix\` to attempt automatic fixes.`;
            const prNumber = context.payload.pull_request.number;
            const marker = '<!-- markdownlint-bot-comment -->';
            const fullBody = `${marker}\n${body}`;

            // Search for an existing bot comment with the marker
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: fullBody,
              });
            }

      - name: Fail on Markdown errors
        if: ${{ steps.lint.outputs.had_errors == 'true' }}
        run: exit 1
