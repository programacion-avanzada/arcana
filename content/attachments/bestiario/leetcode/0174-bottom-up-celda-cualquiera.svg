<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent;" viewBox="0 0 900 480" width="900" height="480">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#757575"/>
</marker>
<style>
  text { font-family: ui-monospace, SFMono-Regular, "Courier New", Consolas, monospace; }
  .frame-fill { fill: none; }
  .stroke-normal { stroke: #757575; stroke-width: 1.5; }
  .frame-main { font-size: 15px; font-weight: 700; fill: #757575; text-anchor: middle; }
  .frame-sub { font-size: 12px; font-weight: 600; fill: #757575; text-anchor: middle; }
  .frame-caption { font-size: 10px; fill: #757575; text-anchor: middle; }
  .edge-line { stroke: #757575; stroke-width: 1.5; fill: none; }
  .panel-label { font-size: 13px; font-weight: bold; fill: #757575; text-anchor: middle; }
  .divider { stroke: #757575; stroke-width: 1; stroke-dasharray: 3,4; opacity: 0.5; }
  .title-text { font-size: 15px; font-weight: bold; fill: #757575; text-anchor: middle; }
  .subtitle-text { font-size: 12px; fill: #757575; text-anchor: middle; }
  .formula-text { font-size: 11px; fill: #757575; text-anchor: middle; }
  .note-text { font-size: 12px; fill: #757575; text-anchor: middle; }
  .legend-text { font-size: 11px; fill: #757575; }
</style>
</defs>

<text x="450" y="28" class="title-text">bottom-up -- dos celdas cualquiera, misma forma de resolverse</text>
<text x="450" y="48" class="subtitle-text">no importa cual celda sea: siempre mira las mismas dos, ya resueltas</text>

<line x1="450" y1="68" x2="450" y2="278" class="divider"/>

<!-- PANEL IZQUIERDO: celda (1,1) -->
<text x="230" y="75" class="panel-label">CELDA (1,1)</text>

<text x="185" y="92" class="frame-caption">abajo</text>
<rect x="140" y="98" width="90" height="44" rx="5" class="frame-fill stroke-normal"/>
<text x="185" y="116" class="frame-main">(2,1)</text>
<text x="185" y="133" class="frame-sub">= 1</text>

<text x="295" y="92" class="frame-caption">derecha</text>
<rect x="250" y="98" width="90" height="44" rx="5" class="frame-fill stroke-normal"/>
<text x="295" y="116" class="frame-main">(1,2)</text>
<text x="295" y="133" class="frame-sub">= 5</text>

<line x1="195" y1="142" x2="215" y2="188" class="edge-line" marker-end="url(#arrow)"/>
<line x1="280" y1="142" x2="255" y2="188" class="edge-line" marker-end="url(#arrow)"/>

<rect x="155" y="190" width="150" height="52" rx="6" class="frame-fill stroke-normal"/>
<text x="230" y="212" class="frame-main">(1,1)</text>
<text x="230" y="230" class="frame-sub">= 11</text>

<text x="230" y="270" class="formula-text">max(1, min(1,5) - (-10)) = 11</text>

<!-- PANEL DERECHO: celda (0,1) -->
<text x="670" y="75" class="panel-label">CELDA (0,1)</text>

<text x="625" y="92" class="frame-caption">abajo</text>
<rect x="580" y="98" width="90" height="44" rx="5" class="frame-fill stroke-normal"/>
<text x="625" y="116" class="frame-main">(1,1)</text>
<text x="625" y="133" class="frame-sub">= 11</text>

<text x="735" y="92" class="frame-caption">derecha</text>
<rect x="690" y="98" width="90" height="44" rx="5" class="frame-fill stroke-normal"/>
<text x="735" y="116" class="frame-main">(0,2)</text>
<text x="735" y="133" class="frame-sub">= 2</text>

<line x1="635" y1="142" x2="655" y2="188" class="edge-line" marker-end="url(#arrow)"/>
<line x1="720" y1="142" x2="695" y2="188" class="edge-line" marker-end="url(#arrow)"/>

<rect x="595" y="190" width="150" height="52" rx="6" class="frame-fill stroke-normal"/>
<text x="670" y="212" class="frame-main">(0,1)</text>
<text x="670" y="230" class="frame-sub">= 5</text>

<text x="670" y="270" class="formula-text">max(1, min(11,2) - (-3)) = 5</text>

<!-- Sentido de construccion -->
<line x1="560" y1="300" x2="340" y2="300" class="edge-line" marker-end="url(#arrow)"/>
<text x="565" y="304" class="legend-text" text-anchor="start">destino</text>
<text x="335" y="304" class="legend-text" text-anchor="end">origen</text>

<!-- Nota compartida -->
<text x="450" y="325" class="note-text">Da igual cual celda sea: sus dos dependencias (abajo y derecha)</text>
<text x="450" y="343" class="note-text">ya estan resueltas antes de necesitarlas.</text>
<text x="450" y="361" class="note-text">Nunca hay que esperar ni volver mas tarde -- por eso no hace falta ninguna pila de llamadas.</text>

<!-- Leyenda -->
<text x="20" y="400" class="legend-text" font-weight="bold">leyenda:</text>
<line x1="20" y1="417" x2="60" y2="417" class="edge-line" marker-end="url(#arrow)"/>
<text x="68" y="421" class="legend-text">valor ya calculado en un paso anterior del loop (nunca se espera)</text>

</svg>
