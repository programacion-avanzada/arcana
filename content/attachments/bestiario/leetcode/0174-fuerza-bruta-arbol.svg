<!-- Edges: nivel 2 -> 3 -->
<path d="M 90,289 L 90,351" class="edge-line edge-dashed"/>
<text x="104" y="324" class="edge-label">D</text>
<path d="M 300,289 L 300,320 L 230,320 L 230,351" class="edge-line"/>
