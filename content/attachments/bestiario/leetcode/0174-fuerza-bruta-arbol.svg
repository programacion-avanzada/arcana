<path d="M 650,389 L 650,444" class="edge-line"/>
<text x="664" y="420.5" class="edge-label">R</text>
<path d="M 790,389 L 790,444" class="edge-line"/>
<text x="804" y="420.5" class="edge-label">R</text>

<!-- Nodos nivel 0 -->
<ellipse cx="440" cy="70" rx="34" ry="19" class="node-fill stroke-normal"/>
<text x="440" y="74" class="ink-text">(0,0)</text>

<!-- Nodos nivel 1 -->
<ellipse cx="195" cy="170" rx="34" ry="19" class="node-fill stroke-normal"/>
