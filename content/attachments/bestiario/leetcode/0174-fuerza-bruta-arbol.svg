<path d="M 580,289 L 580,320 L 510,320 L 510,351" class="edge-line"/>
<text x="545" y="314" class="edge-label">R</text>
<path d="M 580,289 L 580,320 L 650,320 L 650,351" class="edge-line edge-dashed"/>
