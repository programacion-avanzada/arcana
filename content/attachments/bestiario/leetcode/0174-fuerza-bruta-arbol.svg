<text x="510" y="482" class="ink-subtext">vida: 22</text>

<ellipse cx="650" cy="470" rx="40" ry="26" class="node-fill stroke-normal"/>
<text x="650" y="466" class="ink-text">(2,2)</text>
<text x="650" y="482" class="ink-subtext">vida: 18</text>

<ellipse cx="790" cy="470" rx="40" ry="26" class="node-fill stroke-normal"/>
