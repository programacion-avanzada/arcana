<path d="M 790,289 L 790,351" class="edge-line"/>
<text x="804" y="324" class="edge-label">R</text>

<!-- Edges: nivel 3 -> hojas -->
<path d="M 90,389 L 90,444" class="edge-line edge-dashed"/>
<text x="104" y="420.5" class="edge-label">D</text>
<path d="M 230,389 L 230,444" class="edge-line edge-dashed"/>
