<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent;" viewBox="0 0 900 600" width="900" height="600">
<defs>
<style>
  text { font-family: ui-monospace, SFMono-Regular, "Courier New", Consolas, monospace; }
  .node-fill { fill: none; }
  .fill-recalculada { fill: rgba(180,83,9,0.14); }
  .fill-optima { fill: rgba(185,28,28,0.12); }
  .stroke-normal { stroke: #757575; stroke-width: 1.5; }
  .stroke-bold { stroke: #b45309; stroke-width: 3.5; }
  .stroke-accent { stroke: #b91c1c; stroke-width: 3.5; }
  .ink-text { font-size: 13px; font-weight: 600; fill: #757575; text-anchor: middle; }
  .ink-subtext { font-size: 11px; font-weight: 600; fill: #757575; text-anchor: middle; }
  .edge-line { stroke: #757575; stroke-width: 1.5; fill: none; }
  .edge-dashed { stroke-dasharray: 6,4; }
  .edge-label { font-size: 11px; font-weight: 600; fill: #757575; text-anchor: middle; }
  .title-text { font-size: 15px; font-weight: bold; fill: #757575; text-anchor: middle; }
  .legend-text { font-size: 11px; fill: #757575; }
</style>
</defs>

<text x="450" y="28" class="title-text">fuerza bruta -- arbol de exploracion (ejemplo 3x3)</text>

<!-- Edges: nivel 0 -> 1 -->
<path d="M 440,89 L 440,120 L 195,120 L 195,151" class="edge-line"/>
<text x="317.5" y="114" class="edge-label">R</text>
<path d="M 440,89 L 440,120 L 685,120 L 685,151" class="edge-line edge-dashed"/>
<text x="562.5" y="114" class="edge-label">D</text>

<!-- Edges: nivel 1 -> 2 -->
<path d="M 195,189 L 195,220 L 90,220 L 90,251" class="edge-line"/>
