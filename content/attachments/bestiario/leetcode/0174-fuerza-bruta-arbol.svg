<!-- Leyenda -->
<text x="20" y="518" class="legend-text" font-weight="bold">leyenda:</text>

<line x1="20" y1="535" x2="50" y2="535" class="edge-line"/>
<text x="58" y="539" class="legend-text">= derecha (R)</text>
<line x1="230" y1="535" x2="260" y2="535" class="edge-line edge-dashed"/>
<text x="268" y="539" class="legend-text">= abajo (D)</text>

<ellipse cx="30" cy="558" rx="10" ry="8" class="node-fill stroke-normal"/>
<text x="48" y="562" class="legend-text">celda visitada una vez</text>
<ellipse cx="290" cy="558" rx="10" ry="8" class="fill-recalculada stroke-bold"/>
<text x="308" y="562" class="legend-text">celda recalculada (mismo (fil,col), distinto camino)</text>
<ellipse cx="710" cy="558" rx="10" ry="8" class="fill-optima stroke-accent"/>
<text x="728" y="562" class="legend-text">camino optimo</text>

</svg>
