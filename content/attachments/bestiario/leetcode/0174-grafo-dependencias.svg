<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent;" viewBox="0 0 900 560" width="900" height="560">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#757575"/>
</marker>
<style>
  text { font-family: ui-monospace, SFMono-Regular, "Courier New", Consolas, monospace; }
  .cell-fill { fill: none; }
  .fill-base { fill: rgba(180,83,9,0.14); }
  .fill-answer { fill: rgba(185,28,28,0.12); }
  .stroke-normal { stroke: #757575; stroke-width: 1.5; }
  .stroke-base { stroke: #b45309; stroke-width: 3.5; }
  .stroke-answer { stroke: #b91c1c; stroke-width: 3.5; }
  .coord-label { font-size: 11px; font-weight: 600; fill: #757575; text-anchor: start; }
  .cell-value { font-size: 22px; font-weight: 700; fill: #757575; text-anchor: middle; }
  .cell-value-base { font-size: 22px; font-weight: 700; fill: #b45309; text-anchor: middle; }
  .cell-value-answer { font-size: 22px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
  .edge-line { stroke: #757575; stroke-width: 1.5; }
  .title-text { font-size: 15px; font-weight: bold; fill: #757575; text-anchor: middle; }
  .subtitle-text { font-size: 12px; fill: #757575; text-anchor: middle; }
  .legend-text { font-size: 11px; fill: #757575; }
</style>
</defs>

<text x="450" y="28" class="title-text">grafo de dependencias (mismo para top-down y bottom-up)</text>
<text x="450" y="48" class="subtitle-text">cada celda depende del resultado de la celda de abajo y la de la derecha</text>

<!-- Flechas de dependencia: fila 0 -->
<line x1="350" y1="140" x2="400" y2="140" class="edge-line" marker-end="url(#arrow)"/>
<line x1="500" y1="140" x2="550" y2="140" class="edge-line" marker-end="url(#arrow)"/>
<!-- fila 1 -->
<line x1="350" y1="290" x2="400" y2="290" class="edge-line" marker-end="url(#arrow)"/>
<line x1="500" y1="290" x2="550" y2="290" class="edge-line" marker-end="url(#arrow)"/>
<!-- fila 2 -->
<line x1="350" y1="440" x2="400" y2="440" class="edge-line" marker-end="url(#arrow)"/>
<line x1="500" y1="440" x2="550" y2="440" class="edge-line" marker-end="url(#arrow)"/>

<!-- columna 0 -->
<line x1="300" y1="175" x2="300" y2="255" class="edge-line" marker-end="url(#arrow)"/>
<line x1="300" y1="325" x2="300" y2="405" class="edge-line" marker-end="url(#arrow)"/>
<!-- columna 1 -->
<line x1="450" y1="175" x2="450" y2="255" class="edge-line" marker-end="url(#arrow)"/>
<line x1="450" y1="325" x2="450" y2="405" class="edge-line" marker-end="url(#arrow)"/>
<!-- columna 2 -->
<line x1="600" y1="175" x2="600" y2="255" class="edge-line" marker-end="url(#arrow)"/>
<line x1="600" y1="325" x2="600" y2="405" class="edge-line" marker-end="url(#arrow)"/>

<!-- Celda (0,0): respuesta final -->
<rect x="250" y="105" width="100" height="70" rx="4" class="fill-answer stroke-answer"/>
<text x="258" y="122" class="coord-label">(0,0)</text>
<text x="300" y="155" class="cell-value-answer">7</text>

<!-- Celda (0,1) -->
<rect x="400" y="105" width="100" height="70" rx="4" class="cell-fill stroke-normal"/>
<text x="408" y="122" class="coord-label">(0,1)</text>
<text x="450" y="155" class="cell-value">5</text>

<!-- Celda (0,2) -->
<rect x="550" y="105" width="100" height="70" rx="4" class="cell-fill stroke-normal"/>
<text x="558" y="122" class="coord-label">(0,2)</text>
<text x="600" y="155" class="cell-value">2</text>

<!-- Celda (1,0) -->
<rect x="250" y="255" width="100" height="70" rx="4" class="cell-fill stroke-normal"/>
<text x="258" y="272" class="coord-label">(1,0)</text>
<text x="300" y="305" class="cell-value">6</text>

<!-- Celda (1,1) -->
<rect x="400" y="255" width="100" height="70" rx="4" class="cell-fill stroke-normal"/>
<text x="408" y="272" class="coord-label">(1,1)</text>
<text x="450" y="305" class="cell-value">11</text>

<!-- Celda (1,2) -->
<rect x="550" y="255" width="100" height="70" rx="4" class="cell-fill stroke-normal"/>
<text x="558" y="272" class="coord-label">(1,2)</text>
<text x="600" y="305" class="cell-value">5</text>

<!-- Celda (2,0) -->
<rect x="250" y="405" width="100" height="70" rx="4" class="cell-fill stroke-normal"/>
<text x="258" y="422" class="coord-label">(2,0)</text>
<text x="300" y="455" class="cell-value">1</text>

<!-- Celda (2,1) -->
<rect x="400" y="405" width="100" height="70" rx="4" class="cell-fill stroke-normal"/>
<text x="408" y="422" class="coord-label">(2,1)</text>
<text x="450" y="455" class="cell-value">1</text>

<!-- Celda (2,2): caso base / destino -->
<rect x="550" y="405" width="100" height="70" rx="4" class="fill-base stroke-base"/>
<text x="558" y="422" class="coord-label">(2,2)</text>
<text x="600" y="455" class="cell-value-base">6</text>

<!-- Leyenda -->
<text x="20" y="500" class="legend-text" font-weight="bold">leyenda:</text>

<line x1="20" y1="517" x2="60" y2="517" class="edge-line" marker-end="url(#arrow)"/>
<text x="68" y="521" class="legend-text">X depende del resultado de Y</text>

<rect x="300" y="509" width="20" height="16" class="fill-base stroke-base"/>
<text x="328" y="521" class="legend-text">destino (caso base)</text>

<rect x="530" y="509" width="20" height="16" class="fill-answer stroke-answer"/>
<text x="558" y="521" class="legend-text">origen -- respuesta final</text>

</svg>
