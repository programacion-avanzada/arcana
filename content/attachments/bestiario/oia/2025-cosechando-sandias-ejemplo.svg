<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent;" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc">
<title id="title">Cosechando sandías: ejemplo con T = 41 y D = 10</title>
<desc id="desc">Seis sandías en las ubicaciones 1, 15, 16, 20, 48 y 87. Se cosechan las de 1, 16 y 48, con 39 kilos. Las de 15 y 16 están a 1 metro y no se pueden cosechar juntas.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#757575"/></marker>
<style>
  text { font-family: ui-monospace, SFMono-Regular, "Courier New", Consolas, monospace; fill: #757575; }
  .title { font-size: 14px; font-weight: bold; text-anchor: middle; }
  .lbl { font-size: 11px; text-anchor: middle; }
  .dist { font-size: 11px; font-weight: bold; text-anchor: middle; }
  .hi { fill: #b45309; font-size: 12px; font-weight: bold; text-anchor: middle; }
  .kg { font-size: 12px; font-weight: bold; text-anchor: middle; }
  .axis { stroke: #757575; stroke-width: 1.5; }
  .on { fill: rgba(180,83,9,0.15); stroke: #b45309; stroke-width: 2.5; }
  .off { fill: none; stroke: #757575; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .arc { fill: none; stroke: #b45309; stroke-width: 1.6; }
  .br { fill: none; stroke: #757575; stroke-width: 1.2; stroke-dasharray: 3 3; }
  .leg { font-size: 11px; }
</style>
</defs>
<text x="360.0" y="28" class="title">T = 41 kg, D = 10 m, cosecha 20 + 2 + 17 = 39 kg</text>
<line x1="30" y1="150" x2="56" y2="150" class="axis"/>
<line x1="104" y1="150" x2="168" y2="150" class="axis"/>
<line x1="216" y1="150" x2="280" y2="150" class="axis"/>
<line x1="328" y1="150" x2="392" y2="150" class="axis"/>
<line x1="440" y1="150" x2="504" y2="150" class="axis"/>
<line x1="552" y1="150" x2="616" y2="150" class="axis"/>
<line x1="664" y1="150" x2="690" y2="150" class="axis" marker-end="url(#arrow)"/>
<text x="136.0" y="142" class="dist">14 m</text>
<text x="248.0" y="142" class="dist">1 m</text>
<text x="360.0" y="142" class="dist">4 m</text>
<text x="472.0" y="142" class="dist">28 m</text>
<text x="584.0" y="142" class="dist">39 m</text>
<circle cx="80" cy="150" r="24" class="on"/>
<text x="80" y="154" class="kg">20 kg</text>
<text x="80" y="194" class="lbl">x = 1</text>
<circle cx="192" cy="150" r="24" class="off"/>
<text x="192" y="154" class="kg">1 kg</text>
<text x="192" y="194" class="lbl">x = 15</text>
<circle cx="304" cy="150" r="24" class="on"/>
<text x="304" y="154" class="kg">2 kg</text>
<text x="304" y="194" class="lbl">x = 16</text>
<circle cx="416" cy="150" r="24" class="off"/>
<text x="416" y="154" class="kg">7 kg</text>
<text x="416" y="194" class="lbl">x = 20</text>
<circle cx="528" cy="150" r="24" class="on"/>
<text x="528" y="154" class="kg">17 kg</text>
<text x="528" y="194" class="lbl">x = 48</text>
<circle cx="640" cy="150" r="24" class="off"/>
<text x="640" y="154" class="kg">5 kg</text>
<text x="640" y="194" class="lbl">x = 87</text>
<path d="M86,126 C100,78 284,78 298,126" class="arc"/>
<text x="192.0" y="84" class="hi">15 m ≥ D</text>
<path d="M310,126 C324,78 508,78 522,126" class="arc"/>
<text x="416.0" y="84" class="hi">32 m ≥ D</text>
<path d="M192,208 L192,216 L304,216 L304,208" class="br"/>
<text x="248.0" y="234" class="lbl">a 1 m, no se pueden cosechar juntas</text>
<circle cx="60" cy="274" r="8" class="on"/><text x="76" y="278" class="leg">cosechada</text>
<circle cx="190" cy="274" r="8" class="off"/><text x="206" y="278" class="leg">no cosechada</text>
<text x="690" y="278" class="leg" text-anchor="end">recorrido de izquierda a derecha, sin escala</text>
</svg>
