<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent;" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="title desc">
<title id="title">Cosechando sandías: primeros niveles del árbol de decisiones de la fuerza bruta</title>
<desc id="desc">Árbol binario que decide cosechar o dejar las sandías en 1, 15 y 16. Cada uno de los 8 nodos del tercer nivel tiene 8 hojas, 64 en total. Los nodos que ya cosecharon 15 y 16 violan la distancia, pero sus hojas se recorren igual.</desc>
