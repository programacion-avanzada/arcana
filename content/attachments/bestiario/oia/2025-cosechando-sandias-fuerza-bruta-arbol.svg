  .set { font-size: 12px; font-weight: bold; text-anchor: middle; }
  .kg { font-size: 11px; text-anchor: middle; }
  .lvl { font-size: 12px; text-anchor: middle; }
  .note { font-size: 12px; text-anchor: middle; }
  .note-hi { font-size: 12px; text-anchor: middle; fill: #b45309; }
  .lab-hi { font-size: 12px; font-weight: bold; text-anchor: middle; fill: #b45309; }
  .tri-lbl { font-size: 11px; text-anchor: middle; }
  .node { fill: none; stroke: #757575; stroke-width: 1.5; }
  .node-hi { fill: rgba(180,83,9,0.15); stroke: #b45309; stroke-width: 2.2; }
  .take { fill: none; stroke: #757575; stroke-width: 1.5; }
  .skip { fill: none; stroke: #757575; stroke-width: 1.5; stroke-dasharray: 5 4; }
