  <path class="transition" d="M264 168H336"/><text class="transition-label" x="300" y="156" text-anchor="middle">f[i]=1</text>
  <path class="transition" d="M564 168H636"/><text class="transition-label" x="600" y="156" text-anchor="middle">c[j]=1</text>
  <text class="formula" x="389" y="299">0</text>
  <g class="xor" stroke="#1a1a2e" fill="none" stroke-width="1"><circle cx="412" cy="294" r="4"/><path d="M409 294h6m-3-3v6"/></g>
  <text class="formula" x="435" y="299">1</text>
  <g class="xor" stroke="#1a1a2e" fill="none" stroke-width="1"><circle cx="459" cy="294" r="4"/><path d="M456 294h6m-3-3v6"/></g>
  <text class="formula" x="482" y="299">1 = 0</text>
