<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">Cubo de Luces: pulsaciones de filas y columnas</title>
  <desc id="desc">Matrices completas con índices desde cero. La fila enciende sus tres luces; al pulsar la columna, la luz de la intersección vuelve a cero.</desc>
  <style>
    text { font-family: "Courier New", Courier, monospace; fill: #1a1a2e; }
    .heading { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; }
    .value { font-size: 14px; }
    .on { fill: #c0742a; }
    .off { fill: #1a1a2e; }
    .grid { stroke: #9baec8; stroke-width: 1; }
    .row-mark { stroke: #c0742a; stroke-width: 2; stroke-dasharray: 6 3; }
    .col-mark { stroke: #9baec8; stroke-width: 2; stroke-dasharray: 2 3; }
    .transition { stroke: #c0742a; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    .transition-label { font-size: 12px; fill: #1a1a2e; }
    .formula { font-size: 16px; }
    .note { font-size: 12px; fill: #1a1a2e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .on { fill: #d4884a; }
      .off, .transition-label, .note { fill: #e2e8f0; }
      .grid, .col-mark { stroke: #4a6fa5; }
      .row-mark, .transition { stroke: #d4884a; }
      .row-fill { fill: #d4884a; }
      .col-fill { fill: #4a6fa5; }
      .intersection-fill { fill: #aa8564; }
      .xor { stroke: #e2e8f0; }
      marker path { fill: #d4884a; }
    }
  </style>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#c0742a"/></marker></defs>
  <text class="heading" x="150" y="43" text-anchor="middle">Estado inicial</text>
  <rect class="row-fill" x="93" y="150" width="114" height="38" fill="#c0742a" fill-opacity="0.11"/>
  <rect class="col-fill" x="131" y="112" width="38" height="114" fill="#9baec8" fill-opacity="0.149"/>
  <rect class="intersection-fill" x="131" y="150" width="38" height="38" fill="#c39560" fill-opacity="0.196"/>
  <line class="grid" x1="93" y1="112" x2="93" y2="226"/>
  <line class="grid" x1="93" y1="112" x2="207" y2="112"/>
