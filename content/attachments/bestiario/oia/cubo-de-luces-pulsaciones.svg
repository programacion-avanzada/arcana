  <text class="value off" x="412" y="131" text-anchor="middle" dominant-baseline="middle">0</text>
  <text class="value off" x="450" y="131" text-anchor="middle" dominant-baseline="middle">0</text>
  <text class="value off" x="488" y="131" text-anchor="middle" dominant-baseline="middle">0</text>
  <text class="value on" x="412" y="169" text-anchor="middle" dominant-baseline="middle">1</text>
