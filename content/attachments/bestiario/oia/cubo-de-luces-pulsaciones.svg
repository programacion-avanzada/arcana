  <rect class="col-fill" x="731" y="112" width="38" height="114" fill="#9baec8" fill-opacity="0.149"/>
  <rect class="intersection-fill" x="731" y="150" width="38" height="38" fill="#c39560" fill-opacity="0.196"/>
