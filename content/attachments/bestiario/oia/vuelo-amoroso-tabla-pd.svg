<svg width="740" height="556" viewBox="0 0 740 556" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vuelo amoroso: tabla de programación dinámica del ejemplo</title>
  <desc id="desc">Tabla dist con t de 0 a 13 en columnas y h de 0 a 13 en filas. Solo se llenan las celdas donde h tiene la misma paridad que t y h es menor o igual a t. El mínimo de la última columna es 23 en h igual a 3. El recorrido reconstruido 0, 1, 2, 3, 4, 5, 6, 7, 6, 5, 4, 3, 4, 3 está resaltado.</desc>
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .cell { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.5; }
    .val-sm { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .idx { font-size: 12px; fill: #777777; text-anchor: middle; }
    .op { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .query { fill: #f5f7fa; stroke: #c0742a; stroke-width: 2; }
    .accent-label { font-size: 13px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .accent-arrow { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .accent-arrow-fill { fill: #c0742a; }
    @media (prefers-color-scheme: dark) {
      .cell { fill: #1e2330; stroke: #4a6fa5; }
      .val-sm { fill: #e2e8f0; }
      .idx { fill: #8899aa; }
      .op { fill: #8899aa; }
      .query { fill: #1e2330; stroke: #d4884a; }
      .accent-label { fill: #d4884a; }
      .accent-arrow { stroke: #d4884a; }
      .accent-arrow-fill { fill: #d4884a; }
    }
  </style>

