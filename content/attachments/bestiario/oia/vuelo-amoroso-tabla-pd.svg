  <text x="128" y="487" class="accent-label" style="text-anchor: start">recorrido reconstruido desde dist[13][3] = 23 (mínimo de la última columna)</text>
  <text x="107" y="512" class="idx">·</text>
  <text x="128" y="512" class="op" style="text-anchor: start">inalcanzable: la paridad de h debe coincidir con la de t, y h ≤ t</text>
  <text x="128" y="536" class="op" style="text-anchor: start">ej.: dist[8][6] = min(dist[7][5], dist[7][7]) + |6 - 9| = min(19, 17) + 3 = 20</text>
