<svg xmlns="http://www.w3.org/2000/svg" width="440" height="470" viewBox="0 0 440 470" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="440" height="470" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="220" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">Solución óptima: 5 cerezas</text>
  <text x="220" y="58" text-anchor="middle" font-size="13" fill="#57606a">Entre los dos recolectores se recogen TODAS las cerezas</text>

  <!-- grid 3x3 origin 90,90 cell 80 -->
  <g stroke="#333" stroke-width="1.4" fill="none">
    <rect x="90" y="90" width="240" height="240"/>
    <line x1="170" y1="90" x2="170" y2="330"/>
    <line x1="250" y1="90" x2="250" y2="330"/>
    <line x1="90" y1="170" x2="330" y2="170"/>
    <line x1="90" y1="250" x2="330" y2="250"/>
  </g>

  <!-- thorns (0,2) (1,2) -->
  <g fill="#7f7f7f">
    <rect x="250" y="90" width="80" height="80"/>
    <rect x="250" y="170" width="80" height="80"/>
  </g>
  <g stroke="#fff" stroke-width="3" stroke-linecap="round">
    <line x1="270" y1="110" x2="310" y2="150"/><line x1="310" y1="110" x2="270" y2="150"/>
    <line x1="270" y1="190" x2="310" y2="230"/><line x1="310" y1="190" x2="270" y2="230"/>
  </g>

  <!-- cherries peach circles: (0,1)(1,0)(2,0)(2,1)(2,2) centers col0=130 col1=210 col2=290 row0=130 row1=210 row2=290 -->
  <g fill="#F5D5B8" stroke="#C77D3A" stroke-width="1.6">
    <circle cx="210" cy="130" r="12"/>
    <circle cx="130" cy="210" r="12"/>
    <circle cx="130" cy="290" r="12"/>
    <circle cx="210" cy="290" r="12"/>
    <circle cx="290" cy="290" r="12"/>
  </g>

  <!-- Walker A violet -->
  <polyline points="130,130 210,130 210,210 210,290 290,290" fill="none" stroke="#5B2C91" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Walker B green -->
  <polyline points="130,130 130,210 130,290 210,290 290,290" fill="none" stroke="#2E9E5B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <circle cx="130" cy="130" r="8" fill="#1f2328"/>
  <text x="130" y="115" text-anchor="middle" font-size="11" fill="#1f2328">inicio</text>
  <circle cx="290" cy="290" r="8" fill="#C74E9B"/>

  <!-- legend -->
  <line x1="120" y1="362" x2="150" y2="362" stroke="#5B2C91" stroke-width="4.5" stroke-linecap="round"/>
  <text x="158" y="366" font-size="13" fill="#1f2328">A → (0,1),(2,1),(2,2)</text>
  <line x1="120" y1="386" x2="150" y2="386" stroke="#2E9E5B" stroke-width="4.5" stroke-linecap="round"/>
  <text x="158" y="390" font-size="13" fill="#1f2328">B → (1,0),(2,0)</text>
  <text x="220" y="424" text-anchor="middle" font-size="12.5" fill="#57606a">(2,1) y (2,2) son compartidas: se cuentan una sola vez</text>
  <text x="220" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#5B2C91">Total = 3 (A) + 2 (B) = 5</text>
</svg>
