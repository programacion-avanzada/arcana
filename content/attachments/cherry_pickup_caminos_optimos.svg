<svg xmlns="http://www.w3.org/2000/svg" width="440" height="470" viewBox="0 0 440 470" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="440" height="470" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="220" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">Solución óptima: 5 cerezas</text>
  <text x="220" y="58" text-anchor="middle" font-size="13" fill="#57606a">Entre los dos recolectores se recogen TODAS las cerezas</text>

  <!-- grid 3x3, origin 90,90 cell 80 -->
  <g stroke="#c9d1d9" stroke-width="1.2" fill="none">
    <rect x="90" y="90" width="240" height="240" rx="6"/>
    <line x1="170" y1="90" x2="170" y2="330"/>
    <line x1="250" y1="90" x2="250" y2="330"/>
    <line x1="90" y1="170" x2="330" y2="170"/>
    <line x1="90" y1="250" x2="330" y2="250"/>
  </g>

  <!-- thorns (0,2)=col2,row0 ; (1,2)=col2,row1 -->
  <rect x="252" y="92" width="76" height="76" rx="5" fill="#3a3f44"/>
  <line x1="270" y1="112" x2="310" y2="148" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="310" y1="112" x2="270" y2="148" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <rect x="252" y="172" width="76" height="76" rx="5" fill="#3a3f44"/>
  <line x1="270" y1="192" x2="310" y2="228" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="310" y1="192" x2="270" y2="228" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

  <!-- cherries: (0,1)c1r0 ,(1,0)c0r1 ,(2,0)c0r2,(2,1)c1r2,(2,2)c2r2 -->
  <!-- positions centers: col0=130 col1=210 col2=290 ; row0=130 row1=210 row2=290 -->
  <circle cx="210" cy="130" r="11" fill="#e5484d"/>
  <circle cx="130" cy="210" r="11" fill="#e5484d"/>
  <circle cx="130" cy="290" r="11" fill="#e5484d"/>
  <circle cx="210" cy="290" r="11" fill="#e5484d"/>
  <circle cx="290" cy="290" r="11" fill="#e5484d"/>

  <!-- Walker A: (0,0)->(0,1)->(1,1)->(2,1)->(2,2) : centers 130,130 ->210,130->210,210->210,290->290,290 -->
  <polyline points="130,130 210,130 210,210 210,290 290,290" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- Walker B: (0,0)->(1,0)->(2,0)->(2,1)->(2,2): 130,130->130,210->130,290->210,290->290,290 -->
  <polyline points="130,130 130,210 130,290 210,290 290,290" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <circle cx="130" cy="130" r="8" fill="#1f2328"/>
  <text x="130" y="118" text-anchor="middle" font-size="11" fill="#1f2328">inicio</text>
  <circle cx="290" cy="290" r="8" fill="#24292f"/>

  <!-- legend -->
  <line x1="120" y1="360" x2="150" y2="360" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="158" y="364" font-size="13" fill="#1f2328">A → (0,1),(2,1),(2,2)</text>
  <line x1="120" y1="384" x2="150" y2="384" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <text x="158" y="388" font-size="13" fill="#1f2328">B → (1,0),(2,0)</text>
  <text x="220" y="424" text-anchor="middle" font-size="12.5" fill="#57606a">(2,1) y (2,2) son compartidas: se cuentan una sola vez</text>
  <text x="220" y="448" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Total = 3 (A) + 2 (B) = 5</text>
</svg>
