<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="440" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="380" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">Reformulación clave: dos recolectores simultáneos</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#57606a">Ida + vuelta  ≡  dos recorridos en paralelo de (0,0) a (N-1,N-1)</text>

  <!-- ===== LEFT: ida + vuelta ===== -->
  <text x="190" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Ida y vuelta (un recolector)</text>

  <!-- grid left -->
  <g stroke="#c9d1d9" stroke-width="1.2" fill="none">
    <rect x="70" y="110" width="240" height="240" rx="6"/>
    <line x1="150" y1="110" x2="150" y2="350"/>
    <line x1="230" y1="110" x2="230" y2="350"/>
    <line x1="70" y1="190" x2="310" y2="190"/>
    <line x1="70" y1="270" x2="310" y2="270"/>
  </g>
  <!-- ida path (down/right) -->
  <polyline points="110,150 110,230 110,310 190,310 270,310" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- vuelta path (up/left) offset -->
  <polyline points="270,310 270,230 190,230 190,150 110,150" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9"/>
  <circle cx="110" cy="150" r="8" fill="#1f2328"/>
  <circle cx="270" cy="310" r="8" fill="#e5484d"/>
  <text x="190" y="378" text-anchor="middle" font-size="12.5" fill="#2563eb">▬ ida (abajo/derecha)</text>
  <text x="190" y="396" text-anchor="middle" font-size="12.5" fill="#16a34a">┄ vuelta (arriba/izq)</text>

  <!-- equivalence arrow -->
  <text x="380" y="232" text-anchor="middle" font-size="40" fill="#8c959f">≡</text>

  <!-- ===== RIGHT: two walkers ===== -->
  <text x="570" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Dos recolectores (ambos bajan/derecha)</text>

  <g stroke="#c9d1d9" stroke-width="1.2" fill="none">
    <rect x="450" y="110" width="240" height="240" rx="6"/>
    <line x1="530" y1="110" x2="530" y2="350"/>
    <line x1="610" y1="110" x2="610" y2="350"/>
    <line x1="450" y1="190" x2="690" y2="190"/>
    <line x1="450" y1="270" x2="690" y2="270"/>
  </g>
  <!-- walker A -->
  <polyline points="490,150 490,230 490,310 570,310 650,310" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- walker B (the reversed return, now forward) -->
  <polyline points="490,150 570,150 570,230 650,230 650,310" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="490" cy="150" r="8" fill="#1f2328"/>
  <circle cx="650" cy="310" r="8" fill="#e5484d"/>
  <text x="570" y="378" text-anchor="middle" font-size="12.5" fill="#2563eb">▬ recolector A</text>
  <text x="570" y="396" text-anchor="middle" font-size="12.5" fill="#16a34a">▬ recolector B</text>

  <text x="380" y="424" text-anchor="middle" font-size="12.5" fill="#57606a">Un camino recorrido al revés tiene la misma forma que uno recorrido hacia adelante.</text>
</svg>
