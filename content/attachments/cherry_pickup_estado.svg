<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="480" height="420" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="240" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">Reducción del estado: 4 → 3 coordenadas</text>
  <text x="240" y="56" text-anchor="middle" font-size="13" fill="#57606a">Tras t pasos, ambos están sobre la misma anti-diagonal r + c = t</text>

  <!-- grid 5x5, origin 80,90, cell 60 -->
  <g stroke="#e1e4e8" stroke-width="1" fill="none">
    <rect x="80" y="90" width="300" height="300" rx="6"/>
    <line x1="140" y1="90" x2="140" y2="390"/>
    <line x1="200" y1="90" x2="200" y2="390"/>
    <line x1="260" y1="90" x2="260" y2="390"/>
    <line x1="320" y1="90" x2="320" y2="390"/>
    <line x1="80" y1="150" x2="380" y2="150"/>
    <line x1="80" y1="210" x2="380" y2="210"/>
    <line x1="80" y1="270" x2="380" y2="270"/>
    <line x1="80" y1="330" x2="380" y2="330"/>
  </g>

  <!-- highlight anti-diagonal t=3 : cells (r,c) with r+c=3 -> (0,3)(1,2)(2,1)(3,0) -->
  <!-- center of (r,c): x=110+c*60, y=120+r*60 -->
  <g fill="#fff3cd" stroke="#e0a800" stroke-width="1.2">
    <rect x="260" y="92" width="58" height="58" rx="4"/>   <!-- (0,3) -->
    <rect x="200" y="152" width="58" height="58" rx="4"/>  <!-- (1,2) -->
    <rect x="140" y="212" width="58" height="58" rx="4"/>  <!-- (2,1) -->
    <rect x="80"  y="272" width="58" height="58" rx="4"/>  <!-- (3,0) -->
  </g>
  <text x="345" y="125" font-size="12" fill="#b8860b">t = r+c = 3</text>

  <!-- walker A at (1,2) blue, walker B at (3,0) green -->
  <circle cx="230" cy="180" r="11" fill="#2563eb"/>
  <text x="230" y="184" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">A</text>
  <circle cx="110" cy="300" r="11" fill="#16a34a"/>
  <text x="110" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">B</text>

  <!-- annotations -->
  <text x="240" y="372" text-anchor="middle" font-size="12.5" fill="#1f2328">A = (r1,c1) = (1,2)   ·   B = (r2,c2) = (3,0)</text>

  <!-- formula box -->
  <rect x="60" y="392" width="0" height="0"/>
  <text x="240" y="404" text-anchor="middle" font-size="15" font-weight="600" fill="#0550ae">c2 = (r1 + c1) − r2   ⇒  estado = (r1, c1, r2)</text>
</svg>
