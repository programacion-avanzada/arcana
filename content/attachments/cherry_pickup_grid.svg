<svg xmlns="http://www.w3.org/2000/svg" width="400" height="420" viewBox="0 0 400 420" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="400" height="420" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="200" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">Instancia de ejemplo (N = 3)</text>
  <text x="200" y="60" text-anchor="middle" font-size="13" fill="#57606a">grid[i][j] ∈ {-1 espina, 0 vacía, 1 cereza}</text>

  <!-- column indices -->
  <text x="110" y="92" text-anchor="middle" font-size="13" fill="#8c959f">c=0</text>
  <text x="200" y="92" text-anchor="middle" font-size="13" fill="#8c959f">c=1</text>
  <text x="290" y="92" text-anchor="middle" font-size="13" fill="#8c959f">c=2</text>
  <!-- row indices -->
  <text x="48" y="155" text-anchor="middle" font-size="13" fill="#8c959f">r=0</text>
  <text x="48" y="245" text-anchor="middle" font-size="13" fill="#8c959f">r=1</text>
  <text x="48" y="335" text-anchor="middle" font-size="13" fill="#8c959f">r=2</text>

  <!-- Row 0: 0, 1(cherry), -1(thorn) -->
  <rect x="74" y="104" width="72" height="72" rx="8" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/>
  <text x="110" y="150" text-anchor="middle" font-size="22" fill="#57606a">0</text>

  <rect x="164" y="104" width="72" height="72" rx="8" fill="#ffeef0" stroke="#ff8088" stroke-width="1.5"/>
  <circle cx="200" cy="140" r="13" fill="#e5484d"/>
  <rect x="199" y="118" width="2.5" height="9" fill="#2da44e" transform="rotate(20 200 122)"/>

  <rect x="254" y="104" width="72" height="72" rx="8" fill="#3a3f44" stroke="#24292f" stroke-width="1.5"/>
  <line x1="270" y1="124" x2="310" y2="156" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="310" y1="124" x2="270" y2="156" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Row 1: 1(cherry), 0, -1(thorn) -->
  <rect x="74" y="194" width="72" height="72" rx="8" fill="#ffeef0" stroke="#ff8088" stroke-width="1.5"/>
  <circle cx="110" cy="230" r="13" fill="#e5484d"/>
  <rect x="109" y="208" width="2.5" height="9" fill="#2da44e" transform="rotate(20 110 212)"/>

  <rect x="164" y="194" width="72" height="72" rx="8" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/>
  <text x="200" y="240" text-anchor="middle" font-size="22" fill="#57606a">0</text>

  <rect x="254" y="194" width="72" height="72" rx="8" fill="#3a3f44" stroke="#24292f" stroke-width="1.5"/>
  <line x1="270" y1="214" x2="310" y2="246" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="310" y1="214" x2="270" y2="246" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Row 2: 1, 1, 1 (cherries) -->
  <rect x="74" y="284" width="72" height="72" rx="8" fill="#ffeef0" stroke="#ff8088" stroke-width="1.5"/>
  <circle cx="110" cy="320" r="13" fill="#e5484d"/>
  <rect x="109" y="298" width="2.5" height="9" fill="#2da44e" transform="rotate(20 110 302)"/>

  <rect x="164" y="284" width="72" height="72" rx="8" fill="#ffeef0" stroke="#ff8088" stroke-width="1.5"/>
  <circle cx="200" cy="320" r="13" fill="#e5484d"/>
  <rect x="199" y="298" width="2.5" height="9" fill="#2da44e" transform="rotate(20 200 302)"/>

  <rect x="254" y="284" width="72" height="72" rx="8" fill="#ffeef0" stroke="#ff8088" stroke-width="1.5"/>
  <circle cx="290" cy="320" r="13" fill="#e5484d"/>
  <rect x="289" y="298" width="2.5" height="9" fill="#2da44e" transform="rotate(20 290 302)"/>

  <!-- start / end markers -->
  <text x="110" y="100" text-anchor="middle" font-size="0"/>
  <text x="200" y="392" text-anchor="middle" font-size="13" fill="#1f2328">Inicio (0,0) ·  ·  · → · · · → Fin (2,2)   ·   5 cerezas en total</text>
</svg>
