<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="700" height="430" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="350" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">Subproblemas superpuestos → memoización</text>
  <text x="350" y="56" text-anchor="middle" font-size="13" fill="#57606a">El mismo estado (r1,c1,r2) se alcanza por muchas ramas distintas</text>

  <!-- edges -->
  <g stroke="#afb8c1" stroke-width="1.6">
    <line x1="350" y1="100" x2="180" y2="170"/>
    <line x1="350" y1="100" x2="290" y2="170"/>
    <line x1="350" y1="100" x2="410" y2="170"/>
    <line x1="350" y1="100" x2="520" y2="170"/>

    <line x1="180" y1="190" x2="120" y2="270"/>
    <line x1="180" y1="190" x2="230" y2="270"/>
    <line x1="290" y1="190" x2="230" y2="270"/>
    <line x1="410" y1="190" x2="470" y2="270"/>
    <line x1="520" y1="190" x2="470" y2="270"/>

    <line x1="230" y1="290" x2="200" y2="360"/>
    <line x1="230" y1="290" x2="320" y2="360"/>
    <line x1="470" y1="290" x2="320" y2="360"/>
  </g>

  <!-- root -->
  <g>
    <rect x="305" y="80" width="90" height="34" rx="17" fill="#0969da"/>
    <text x="350" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">(0,0,0)</text>
  </g>

  <!-- level 2 nodes -->
  <g font-size="12.5" font-weight="600">
    <rect x="140" y="170" width="80" height="32" rx="16" fill="#eaeef2" stroke="#afb8c1"/>
    <text x="180" y="191" text-anchor="middle" fill="#1f2328">(1,0,1)</text>
    <rect x="250" y="170" width="80" height="32" rx="16" fill="#eaeef2" stroke="#afb8c1"/>
    <text x="290" y="191" text-anchor="middle" fill="#1f2328">(1,0,0)</text>
    <rect x="370" y="170" width="80" height="32" rx="16" fill="#eaeef2" stroke="#afb8c1"/>
    <text x="410" y="191" text-anchor="middle" fill="#1f2328">(0,1,1)</text>
    <rect x="480" y="170" width="80" height="32" rx="16" fill="#eaeef2" stroke="#afb8c1"/>
    <text x="520" y="191" text-anchor="middle" fill="#1f2328">(0,1,0)</text>
  </g>

  <!-- level 3 nodes, with repeated (2,1,2) highlighted -->
  <g font-size="12.5" font-weight="600">
    <rect x="80" y="270" width="80" height="32" rx="16" fill="#eaeef2" stroke="#afb8c1"/>
    <text x="120" y="291" text-anchor="middle" fill="#1f2328">(2,0,2)</text>

    <rect x="190" y="270" width="80" height="32" rx="16" fill="#ffe3e3" stroke="#e5484d" stroke-width="2"/>
    <text x="230" y="291" text-anchor="middle" fill="#a40e26">(1,1,2)</text>

    <rect x="430" y="270" width="80" height="32" rx="16" fill="#ffe3e3" stroke="#e5484d" stroke-width="2"/>
    <text x="470" y="291" text-anchor="middle" fill="#a40e26">(1,1,2)</text>
  </g>

  <!-- level 4 -->
  <g font-size="12.5" font-weight="600">
    <rect x="160" y="360" width="80" height="32" rx="16" fill="#eaeef2" stroke="#afb8c1"/>
    <text x="200" y="381" text-anchor="middle" fill="#1f2328">(2,1,2)</text>
    <rect x="280" y="360" width="80" height="32" rx="16" fill="#ffe3e3" stroke="#e5484d" stroke-width="2"/>
    <text x="320" y="381" text-anchor="middle" fill="#a40e26">(2,2,2)</text>
  </g>

  <!-- callout for repeated -->
  <rect x="500" y="330" width="180" height="78" rx="8" fill="#fff5f5" stroke="#e5484d" stroke-width="1.3"/>
  <text x="590" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a40e26">Nodos repetidos</text>
  <text x="590" y="372" text-anchor="middle" font-size="11.5" fill="#57606a">Fuerza bruta: recalcula</text>
  <text x="590" y="388" text-anchor="middle" font-size="11.5" fill="#57606a">PD: cachea y reutiliza</text>
  <text x="590" y="404" text-anchor="middle" font-size="11.5" fill="#57606a">O(4^2N) → O(N³)</text>
</svg>
