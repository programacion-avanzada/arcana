<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="740" height="400" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">La tabla de Programación Dinámica</text>
  <text x="370" y="56" text-anchor="middle" font-size="13" fill="#57606a">El estado es 3D: la tabla se indexa por (r1, c1, r2), no por una matriz 2D</text>

  <!-- ===== LEFT: grid original ===== -->
  <text x="60" y="88" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#8a8a8a">grid</text>

  <g font-family="Consolas, Menlo, monospace" font-size="20" text-anchor="middle" fill="#1f2328">
    <rect x="60" y="98" width="66" height="66" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="93" y="139">0</text>
    <rect x="126" y="98" width="66" height="66" fill="#F5D5B8" stroke="#333" stroke-width="2"/><text x="159" y="139">1</text>
    <rect x="192" y="98" width="66" height="66" fill="#7f7f7f" stroke="#333" stroke-width="2"/><text x="225" y="139" fill="#fff">-1</text>

    <rect x="60" y="164" width="66" height="66" fill="#F5D5B8" stroke="#333" stroke-width="2"/><text x="93" y="205">1</text>
    <rect x="126" y="164" width="66" height="66" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="159" y="205">0</text>
    <rect x="192" y="164" width="66" height="66" fill="#7f7f7f" stroke="#333" stroke-width="2"/><text x="225" y="205" fill="#fff">-1</text>

    <rect x="60" y="230" width="66" height="66" fill="#F5D5B8" stroke="#333" stroke-width="2"/><text x="93" y="271">1</text>
    <rect x="126" y="230" width="66" height="66" fill="#F5D5B8" stroke="#333" stroke-width="2"/><text x="159" y="271">1</text>
    <rect x="192" y="230" width="66" height="66" fill="#F5D5B8" stroke="#333" stroke-width="2"/><text x="225" y="271">1</text>
  </g>

  <!-- arrow -->
  <path d="M282,197 L322,197" stroke="#5B2C91" stroke-width="3" marker-end="url(#pv)"/>
  <defs>
    <marker id="pv" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B2C91"/>
    </marker>
  </defs>

  <!-- ===== RIGHT: memo table ===== -->
  <text x="350" y="88" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#5B2C91">memo  (tabla P.D.)</text>

  <!-- header -->
  <g font-family="Consolas, Menlo, monospace" font-size="13" text-anchor="middle">
    <rect x="350" y="98" width="120" height="34" fill="#CFE2F3" stroke="#333" stroke-width="1.6"/><text x="410" y="120" font-weight="700" fill="#1f2328">(r1,c1,r2)</text>
    <rect x="470" y="98" width="70" height="34" fill="#CFE2F3" stroke="#333" stroke-width="1.6"/><text x="505" y="120" font-weight="700" fill="#1f2328">c2</text>
    <rect x="540" y="98" width="140" height="34" fill="#CFE2F3" stroke="#333" stroke-width="1.6"/><text x="610" y="120" font-weight="700" fill="#1f2328">explorar</text>

    <!-- rows -->
    <rect x="350" y="132" width="120" height="30" fill="#ffffff" stroke="#333" stroke-width="1.2"/><text x="410" y="152" fill="#1f2328">(2,2,2)</text>
    <rect x="470" y="132" width="70" height="30" fill="#ffffff" stroke="#333" stroke-width="1.2"/><text x="505" y="152" fill="#1f2328">2</text>
    <rect x="540" y="132" width="140" height="30" fill="#ffffff" stroke="#333" stroke-width="1.2"/><text x="610" y="152" fill="#1f2328">1</text>

    <rect x="350" y="162" width="120" height="30" fill="#ffffff" stroke="#333" stroke-width="1.2"/><text x="410" y="182" fill="#1f2328">(2,1,2)</text>
    <rect x="470" y="162" width="70" height="30" fill="#ffffff" stroke="#333" stroke-width="1.2"/><text x="505" y="182" fill="#1f2328">1</text>
    <rect x="540" y="162" width="140" height="30" fill="#ffffff" stroke="#333" stroke-width="1.2"/><text x="610" y="182" fill="#1f2328">2</text>

    <rect x="350" y="192" width="120" height="30" fill="#FFE599" stroke="#E8912D" stroke-width="1.8"/><text x="410" y="212" fill="#1f2328">(1,1,1)</text>
    <rect x="470" y="192" width="70" height="30" fill="#FFE599" stroke="#E8912D" stroke-width="1.8"/><text x="505" y="212" fill="#1f2328">1</text>
    <rect x="540" y="192" width="140" height="30" fill="#FFE599" stroke="#E8912D" stroke-width="1.8"/><text x="610" y="212" fill="#1f2328">3</text>

    <rect x="350" y="222" width="120" height="30" fill="#ffffff" stroke="#333" stroke-width="1.2"/><text x="410" y="242" fill="#1f2328">(1,0,0)</text>
    <rect x="470" y="222" width="70" height="30" fill="#ffffff" stroke="#333" stroke-width="1.2"/><text x="505" y="242" fill="#1f2328">1</text>
    <rect x="540" y="222" width="140" height="30" fill="#ffffff" stroke="#333" stroke-width="1.2"/><text x="610" y="242" fill="#1f2328">5</text>

    <rect x="350" y="252" width="120" height="30" fill="#ffffff" stroke="#333" stroke-width="1.2"/><text x="410" y="272" fill="#1f2328">(0,1,1)</text>
    <rect x="470" y="252" width="70" height="30" fill="#ffffff" stroke="#333" stroke-width="1.2"/><text x="505" y="272" fill="#1f2328">0</text>
    <rect x="540" y="252" width="140" height="30" fill="#ffffff" stroke="#333" stroke-width="1.2"/><text x="610" y="272" fill="#1f2328">5</text>

    <!-- respuesta -->
    <rect x="350" y="282" width="120" height="32" fill="#F5D5B8" stroke="#333" stroke-width="2"/><text x="410" y="304" font-weight="700" fill="#1f2328">(0,0,0)</text>
    <rect x="470" y="282" width="70" height="32" fill="#F5D5B8" stroke="#333" stroke-width="2"/><text x="505" y="304" font-weight="700" fill="#1f2328">0</text>
    <rect x="540" y="282" width="140" height="32" fill="#F5D5B8" stroke="#333" stroke-width="2"/><text x="610" y="304" font-weight="700" fill="#1f2328">5</text>
  </g>

  <text x="515" y="338" text-anchor="middle" font-size="12.5" fill="#57606a">El estado inicial (0,0,0) guarda la respuesta del problema.</text>

  <!-- leyenda naranja -->
  <rect x="350" y="352" width="16" height="16" fill="#FFE599" stroke="#E8912D" stroke-width="1.6"/>
  <text x="374" y="365" font-size="12" fill="#B26A12">estado reutilizado desde varias ramas</text>

  <text x="159" y="330" text-anchor="middle" font-size="12.5" fill="#57606a">Se recorre en orden inverso:</text>
  <text x="159" y="348" text-anchor="middle" font-size="12.5" fill="#57606a">del caso base (2,2,2)</text>
  <text x="159" y="366" text-anchor="middle" font-size="12.5" fill="#57606a">hacia el objetivo (0,0,0).</text>
</svg>
