<svg width="560" height="260" viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame       { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.8; }
    .divider     { stroke: #9baec8; stroke-width: 1; }
    .val         { font-size: 20px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .idx         { font-size: 12px; fill: #777777; text-anchor: middle; }
    .op          { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .op-arrow    { stroke: #777777; stroke-width: 1.5; fill: none; }
    .top-label   { font-size: 13px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .top-arrow   { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .top-arrow-fill { fill: #c0742a; }
    @media (prefers-color-scheme: dark) {
      .frame       { fill: #1e2330; stroke: #4a6fa5; }
      .divider     { stroke: #4a6fa5; }
      .val         { fill: #e2e8f0; }
      .idx         { fill: #8899aa; }
      .op          { fill: #8899aa; }
      .op-arrow    { stroke: #8899aa; }
      .top-label   { fill: #d4884a; }
      .top-arrow   { stroke: #d4884a; }
      .top-arrow-fill { fill: #d4884a; }
    }
  </style>

  <!-- array: bloque contiguo de memoria, un solo frame con divisores internos -->
  <rect x="40" y="90" width="480" height="60" rx="8" class="frame"/>
  <line x1="100" y1="90" x2="100" y2="150" class="divider"/>
  <line x1="160" y1="90" x2="160" y2="150" class="divider"/>
  <line x1="220" y1="90" x2="220" y2="150" class="divider"/>
  <line x1="280" y1="90" x2="280" y2="150" class="divider"/>
  <line x1="340" y1="90" x2="340" y2="150" class="divider"/>
  <line x1="400" y1="90" x2="400" y2="150" class="divider"/>
  <line x1="460" y1="90" x2="460" y2="150" class="divider"/>

  <text x="70"  y="127" class="val">12</text>
  <text x="130" y="127" class="val">7</text>
  <text x="190" y="127" class="val">25</text>
  <text x="250" y="127" class="val">3</text>
  <text x="310" y="127" class="val">18</text>
  <text x="370" y="127" class="val">9</text>
  <text x="430" y="127" class="val">30</text>
  <text x="490" y="127" class="val">14</text>

  <text x="70"  y="168" class="idx">0</text>
  <text x="130" y="168" class="idx">1</text>
  <text x="190" y="168" class="idx">2</text>
  <text x="250" y="168" class="idx">3</text>
  <text x="310" y="168" class="idx">4</text>
  <text x="370" y="168" class="idx">5</text>
  <text x="430" y="168" class="idx">6</text>
  <text x="490" y="168" class="idx">7</text>

  <!-- acceso indexado: A[3] es O(1) porque la dirección se calcula, no se busca -->
  <rect x="222" y="92" width="56" height="56" rx="4" class="top-arrow"/>
  <text x="250" y="72" class="top-label">A[3]</text>
  <path d="M250,78 L250,86" class="top-arrow"/>
  <path d="M244,86 L250,94 L256,86 Z" class="top-arrow-fill"/>

  <!-- desplazamiento desde la base -->
  <path d="M40,185 L40,192 L220,192 L220,185" class="op-arrow"/>
  <text x="130" y="207" class="op">3 x tamaño</text>
  <text x="40" y="207" class="op">base</text>

  <text x="280" y="235" class="op">dirección(A[3]) = base + 3 x tamaño</text>
</svg>
