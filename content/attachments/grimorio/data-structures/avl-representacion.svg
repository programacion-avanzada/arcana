<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img">
  <title>Estructura interna de un árbol AVL: cada nodo guarda su clave, su altura y punteros a los dos hijos; los hijos ausentes valen null y el factor de balance de cada nodo se mantiene en {-1, 0, 1}</title>
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .link  { stroke: #9baec8; stroke-width: 1.8; fill: none; }
    .nil   { stroke: #cbd5e2; stroke-width: 1.4; fill: none; stroke-dasharray: 4,4; }
    .node  { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.8; }
    .box   { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.4; }
    .val   { font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .fb    { font-weight: 700; fill: #7c8ba1; text-anchor: start; }
    .null  { fill: #aab6c6; text-anchor: middle; }
    .cap   { fill: #7c8ba1; text-anchor: middle; }
    .capl  { fill: #7c8ba1; text-anchor: start; }
    .fld   { fill: #1a1a2e; text-anchor: start; }
    .key   { fill: #7c8ba1; text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .link { stroke: #4a6fa5; }
      .nil  { stroke: #3a4557; }
      .node { fill: #1e2330; stroke: #4a6fa5; }
      .box  { fill: #1e2330; stroke: #4a6fa5; }
      .val  { fill: #e2e8f0; }
      .fb   { fill: #8899aa; }
      .null { fill: #5b6879; }
      .cap  { fill: #8899aa; }
      .capl { fill: #8899aa; }
      .fld  { fill: #e2e8f0; }
      .key  { fill: #8899aa; }
    }
  </style>

  <text class="cap" x="360" y="30" font-size="12">Estructura interna: el árbol es un puntero a la raíz y cada nodo enlaza a sus hijos</text>

  <!-- aristas -->
  <line class="link" x1="343" y1="110" x2="217" y2="164"/>
  <line class="link" x1="377" y1="110" x2="503" y2="164"/>
  <line class="link" x1="183" y1="200" x2="137" y2="254"/>
  <line class="link" x1="217" y1="200" x2="263" y2="254"/>
  <line class="link" x1="537" y1="200" x2="583" y2="254"/>

  <!-- punteros nulos -->
  <line class="nil" x1="503" y1="200" x2="462" y2="250"/>
  <line class="nil" x1="103" y1="290" x2="78"  y2="322"/>
  <line class="nil" x1="137" y1="290" x2="162" y2="322"/>
  <line class="nil" x1="263" y1="290" x2="238" y2="322"/>
  <line class="nil" x1="297" y1="290" x2="322" y2="322"/>
  <line class="nil" x1="583" y1="290" x2="558" y2="322"/>
  <line class="nil" x1="617" y1="290" x2="642" y2="322"/>

  <text class="null" x="462" y="262" font-size="11">null</text>
  <text class="null" x="72"  y="334" font-size="11">null</text>
  <text class="null" x="168" y="334" font-size="11">null</text>
  <text class="null" x="232" y="334" font-size="11">null</text>
  <text class="null" x="328" y="334" font-size="11">null</text>
  <text class="null" x="552" y="334" font-size="11">null</text>
  <text class="null" x="648" y="334" font-size="11">null</text>

  <!-- nodos -->
  <circle class="node" cx="360" cy="92"  r="24"/>
  <text   class="val"  x="360" y="98" font-size="15">30</text>
  <text   class="fb"   x="392" y="88" font-size="11">altura 3</text>
  <text   class="fb"   x="392" y="102" font-size="11">FB 0</text>

  <circle class="node" cx="200" cy="182" r="24"/>
  <text   class="val"  x="200" y="188" font-size="15">20</text>
  <text   class="fb"   x="232" y="178" font-size="11">altura 2</text>
  <text   class="fb"   x="232" y="192" font-size="11">FB 0</text>

  <circle class="node" cx="520" cy="182" r="24"/>
  <text   class="val"  x="520" y="188" font-size="15">40</text>
  <text   class="fb"   x="552" y="178" font-size="11">altura 2</text>
  <text   class="fb"   x="552" y="192" font-size="11">FB -1</text>

  <circle class="node" cx="120" cy="272" r="24"/>
  <text   class="val"  x="120" y="278" font-size="15">10</text>
  <text   class="fb"   x="152" y="268" font-size="11">altura 1</text>
  <text   class="fb"   x="152" y="282" font-size="11">FB 0</text>

  <circle class="node" cx="280" cy="272" r="24"/>
  <text   class="val"  x="280" y="278" font-size="15">25</text>
  <text   class="fb"   x="312" y="268" font-size="11">altura 1</text>
  <text   class="fb"   x="312" y="282" font-size="11">FB 0</text>

  <circle class="node" cx="600" cy="272" r="24"/>
  <text   class="val"  x="600" y="278" font-size="15">50</text>
  <text   class="fb"   x="632" y="268" font-size="11">altura 1</text>
  <text   class="fb"   x="632" y="282" font-size="11">FB 0</text>

  <!-- detalle de un nodo -->
  <rect class="box" x="40" y="354" width="330" height="52" rx="6"/>
  <text class="key" x="54" y="373" font-size="11">el nodo 40 por dentro</text>
  <text class="fld" x="54" y="392" font-size="11">clave 40 | altura 2 | izq null | der -&gt; 50</text>

  <text class="capl" x="396" y="373" font-size="11">FB = altura(izq) - altura(der)</text>
  <text class="capl" x="396" y="392" font-size="11">invariante: FB en {-1, 0, 1} para todo nodo</text>
</svg>
