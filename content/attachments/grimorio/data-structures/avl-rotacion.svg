    .lvl       { fill: #aab6c6; }
    .dot       { fill: #cbd5e2; }
    .dot-on    { fill: #c0742a; }
    @media (prefers-color-scheme: dark) {
      .link      { stroke: #4a6fa5; }
      .link-move { stroke: #d4884a; }
