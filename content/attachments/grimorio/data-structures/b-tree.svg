<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Menlo, Consolas, monospace" font-size="14">
  <!-- fondo transparente a proposito -->

  <!-- Conectores: cada uno sale de una celda-puntero (vacia) del nodo padre -->
  <line x1="416.25" y1="60" x2="228.0" y2="140" stroke="#16738f" stroke-width="2"/>
  <line x1="483.75" y1="60" x2="672.0" y2="140" stroke="#16738f" stroke-width="2"/>

  <line x1="163.71" y1="180" x2="80.0" y2="260" stroke="#16738f" stroke-width="2"/>
  <line x1="228.0" y1="180" x2="228.0" y2="260" stroke="#16738f" stroke-width="2"/>
  <line x1="292.29" y1="180" x2="376.0" y2="260" stroke="#16738f" stroke-width="2"/>

  <line x1="607.71" y1="180" x2="524.0" y2="260" stroke="#16738f" stroke-width="2"/>
  <line x1="672.0" y1="180" x2="672.0" y2="260" stroke="#16738f" stroke-width="2"/>
  <line x1="736.29" y1="180" x2="820.0" y2="260" stroke="#16738f" stroke-width="2"/>

  <!-- Raiz: clave 50 -->
  <g>
    <rect x="427.5" y="20" width="45.0" height="40" fill="#16738f"/>
    <rect x="405" y="20" width="90" height="40" rx="8" fill="none" stroke="#16738f" stroke-width="1.75">
      <animate attributeName="stroke" dur="4s" repeatCount="indefinite"
        keyTimes="0;0.1;0.35;0.5;0.55;0.62;0.85;0.95;1"
        values="#42bde1;#42bde1;#16738f;#16738f;#16738f;#16738f;#16738f;#16738f;#16738f"/>
      <animate attributeName="stroke-width" dur="4s" repeatCount="indefinite"
        keyTimes="0;0.1;0.35;0.5;0.55;0.62;0.85;0.95;1"
        values="3;3;1.75;1.75;1.75;1.75;1.75;1.75;1.75"/></rect>
    <text x="450.0" y="45.0" text-anchor="middle" fill="#ffffff" font-weight="bold">50</text>
  </g>

  <!-- Nivel 1 izquierdo: claves 20 | 35 -->
  <g>
    <rect x="174.43" y="140" width="42.86" height="40" fill="#16738f"/>
    <rect x="238.71" y="140" width="42.86" height="40" fill="#16738f"/>
    <rect x="153" y="140" width="150" height="40" rx="8" fill="none" stroke="#16738f" stroke-width="1.75"></rect>
    <text x="195.86" y="165.0" text-anchor="middle" fill="#ffffff" font-weight="bold">20</text>
    <text x="260.14" y="165.0" text-anchor="middle" fill="#ffffff" font-weight="bold">35</text>
  </g>

  <!-- Nivel 1 derecho: claves 70 | 90 (nodo de la busqueda) -->
  <g>
    <rect x="618.43" y="140" width="42.86" height="40" fill="#16738f"/>
    <rect x="682.71" y="140" width="42.86" height="40" fill="#16738f"/>
    <rect x="597" y="140" width="150" height="40" rx="8" fill="none" stroke="#16738f" stroke-width="1.75">
      <animate attributeName="stroke" dur="4s" repeatCount="indefinite"
        keyTimes="0;0.1;0.35;0.5;0.55;0.62;0.85;0.95;1"
        values="#16738f;#16738f;#42bde1;#42bde1;#16738f;#16738f;#16738f;#16738f;#16738f"/>
      <animate attributeName="stroke-width" dur="4s" repeatCount="indefinite"
        keyTimes="0;0.1;0.35;0.5;0.55;0.62;0.85;0.95;1"
        values="1.75;1.75;3;3;1.75;1.75;1.75;1.75;1.75"/></rect>
    <text x="639.86" y="165.0" text-anchor="middle" fill="#ffffff" font-weight="bold">70</text>
    <text x="704.14" y="165.0" text-anchor="middle" fill="#ffffff" font-weight="bold">90</text>
  </g>

  <!-- Hoja L1 -->
  <g>
    <rect x="33.57" y="260" width="37.14" height="40" fill="#16738f"/>
    <rect x="89.29" y="260" width="37.14" height="40" fill="#16738f"/>
    <rect x="15" y="260" width="130" height="40" rx="8" fill="none" stroke="#16738f" stroke-width="1.75"></rect>
    <text x="52.14" y="285.0" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text>
    <text x="107.86" y="285.0" text-anchor="middle" fill="#ffffff" font-weight="bold">10</text>
  </g>

  <!-- Hoja L2 -->
  <g>
    <rect x="181.57" y="260" width="37.14" height="40" fill="#16738f"/>
    <rect x="237.29" y="260" width="37.14" height="40" fill="#16738f"/>
    <rect x="163" y="260" width="130" height="40" rx="8" fill="none" stroke="#16738f" stroke-width="1.75"></rect>
    <text x="200.14" y="285.0" text-anchor="middle" fill="#ffffff" font-weight="bold">25</text>
    <text x="255.86" y="285.0" text-anchor="middle" fill="#ffffff" font-weight="bold">30</text>
  </g>

  <!-- Hoja L3 -->
  <g>
    <rect x="329.57" y="260" width="37.14" height="40" fill="#16738f"/>
    <rect x="385.29" y="260" width="37.14" height="40" fill="#16738f"/>
    <rect x="311" y="260" width="130" height="40" rx="8" fill="none" stroke="#16738f" stroke-width="1.75"></rect>
    <text x="348.14" y="285.0" text-anchor="middle" fill="#ffffff" font-weight="bold">40</text>
    <text x="403.86" y="285.0" text-anchor="middle" fill="#ffffff" font-weight="bold">45</text>
  </g>

  <!-- Hoja R1 -->
  <g>
    <rect x="477.57" y="260" width="37.14" height="40" fill="#16738f"/>
    <rect x="533.29" y="260" width="37.14" height="40" fill="#16738f"/>
    <rect x="459" y="260" width="130" height="40" rx="8" fill="none" stroke="#16738f" stroke-width="1.75"></rect>
    <text x="496.14" y="285.0" text-anchor="middle" fill="#ffffff" font-weight="bold">55</text>
    <text x="551.86" y="285.0" text-anchor="middle" fill="#ffffff" font-weight="bold">60</text>
  </g>

  <!-- Hoja R3 -->
  <g>
    <rect x="773.57" y="260" width="37.14" height="40" fill="#16738f"/>
    <rect x="829.29" y="260" width="37.14" height="40" fill="#16738f"/>
    <rect x="755" y="260" width="130" height="40" rx="8" fill="none" stroke="#16738f" stroke-width="1.75"></rect>
    <text x="792.14" y="285.0" text-anchor="middle" fill="#ffffff" font-weight="bold">95</text>
    <text x="847.86" y="285.0" text-anchor="middle" fill="#ffffff" font-weight="bold">99</text>
  </g>

  <!-- Hoja donde esta la clave 75 -->
  <g>
    <rect x="625.57" y="260" width="37.14" height="40" fill="#16738f"/>
    <rect x="681.29" y="260" width="37.14" height="40" fill="#16738f"/>
    <rect x="607" y="260" width="130" height="40" rx="8" fill="none" stroke="#16738f" stroke-width="1.75">
      <animate attributeName="stroke" dur="4s" repeatCount="indefinite"
        keyTimes="0;0.1;0.35;0.5;0.55;0.62;0.85;0.95;1"
        values="#16738f;#16738f;#16738f;#16738f;#42bde1;#9adbef;#9adbef;#16738f;#16738f"/>
      <animate attributeName="stroke-width" dur="4s" repeatCount="indefinite"
        keyTimes="0;0.1;0.35;0.5;0.55;0.62;0.85;0.95;1"
        values="1.75;1.75;1.75;1.75;3;3;3;1.75;1.75"/></rect>
    <text x="644.14" y="285.0" text-anchor="middle" fill="#ffffff" font-weight="bold">75</text>
    <text x="699.86" y="285.0" text-anchor="middle" fill="#ffffff" font-weight="bold">80</text>
  </g>
  <circle cx="644.14" cy="280.0" r="0" fill="#9adbef" opacity="0">
    <animate attributeName="r" dur="4s" repeatCount="indefinite"
      keyTimes="0;0.1;0.35;0.5;0.55;0.62;0.85;0.95;1"
      values="0;0;0;0;0;22;22;0;0"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
      keyTimes="0;0.1;0.35;0.5;0.55;0.62;0.85;0.95;1"
      values="0;0;0;0;0;0.35;0.35;0;0"/>
  </circle>

  <!-- Token que recorre raiz -> nodo derecho -> hoja, buscando la clave 75 -->
  <circle cx="483.75" cy="40.0" r="7" fill="#42bde1" stroke="#0f172a" stroke-width="2">
    <animate attributeName="cx" dur="4s" repeatCount="indefinite"
      keyTimes="0;0.1;0.35;0.5;0.55;0.62;0.85;0.95;1"
      values="483.75;483.75;672.0;672.0;672.0;644.14;644.14;483.75;483.75"/>
    <animate attributeName="cy" dur="4s" repeatCount="indefinite"
      keyTimes="0;0.1;0.35;0.5;0.55;0.62;0.85;0.95;1"
      values="40.0;40.0;160.0;160.0;160.0;280.0;280.0;40.0;40.0"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
      keyTimes="0;0.1;0.35;0.5;0.55;0.62;0.85;0.95;1"
      values="1;1;1;1;1;1;1;0;0"/>
  </circle>
</svg>
