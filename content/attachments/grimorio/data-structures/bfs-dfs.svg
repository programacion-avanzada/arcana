<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs>
    <marker id="arrowBold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8fb4e8"/>
    </marker>
    <style>
      .bg { fill:#121212; }
      .panel { fill:#090909; stroke:#2f4f78; stroke-width:2; }
      .node { fill:#0f0f0f; stroke:#6f91bd; stroke-width:3; }
      .dim { fill:none; stroke:#33475e; stroke-width:2; stroke-dasharray:5,5; }
      .tree { fill:none; stroke:#8fb4e8; stroke-width:3.5; marker-end:url(#arrowBold); }
      .badge { fill:#8fb4e8; stroke:#0f0f0f; stroke-width:1.5; }
      .txt { fill:#d7e5f6; font-family: Consolas, 'Courier New', monospace; }
      .title { font-size:26px; font-weight:700; }
      .label { font-size:24px; font-weight:700; }
      .badgeTxt { fill:#0a0f16; font-size:16px; font-weight:700; }
      .small { font-size:17px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="660"/>
  <rect class="panel" x="30" y="30" rx="10" ry="10" width="555" height="560"/>
  <rect class="panel" x="615" y="30" rx="10" ry="10" width="555" height="560"/>

  <text class="txt title" x="307" y="82" text-anchor="middle">BFS (anchura)</text>
  <text class="txt title" x="897" y="82" text-anchor="middle">DFS (profundidad)</text>

  <!-- ================= PANEL BFS ================= -->
  <g transform="translate(30,30)">
    <!-- aristas del grafo (todas), atenuadas -->
    <path class="dim" d="M277 130 L150 260"/>
    <path class="dim" d="M277 130 L404 260"/>
    <path class="dim" d="M150 260 L90 400"/>
    <path class="dim" d="M150 260 L230 400"/>
    <path class="dim" d="M404 260 L404 400"/>
    <path class="dim" d="M230 400 L404 400"/>

    <!-- vertices -->
    <circle class="node" cx="277" cy="130" r="34"/>
    <circle class="node" cx="150" cy="260" r="34"/>
    <circle class="node" cx="404" cy="260" r="34"/>
    <circle class="node" cx="90" cy="400" r="34"/>
    <circle class="node" cx="230" cy="400" r="34"/>
    <circle class="node" cx="404" cy="400" r="34"/>

    <text class="txt label" x="277" y="139" text-anchor="middle">A</text>
    <text class="txt label" x="150" y="269" text-anchor="middle">B</text>
    <text class="txt label" x="404" y="269" text-anchor="middle">C</text>
    <text class="txt label" x="90" y="409" text-anchor="middle">D</text>
    <text class="txt label" x="230" y="409" text-anchor="middle">E</text>
    <text class="txt label" x="404" y="409" text-anchor="middle">F</text>

    <!-- arbol de descubrimiento BFS: A-B, A-C, B-D, B-E, C-F (E-F queda sin usar) -->
    <path class="tree" d="M253.24 154.32 L173.76 235.68"/>
    <path class="tree" d="M300.76 154.32 L380.24 235.68"/>
    <path class="tree" d="M136.61 291.25 L103.39 368.75"/>
    <path class="tree" d="M166.87 289.52 L213.13 370.48"/>
    <path class="tree" d="M404 294 L404 366"/>

    <!-- orden de visita -->
    <circle class="badge" cx="301" cy="106" r="15"/>
    <text class="txt badgeTxt" x="301" y="111" text-anchor="middle">1</text>
    <circle class="badge" cx="174" cy="236" r="15"/>
    <text class="txt badgeTxt" x="174" y="241" text-anchor="middle">2</text>
    <circle class="badge" cx="428" cy="236" r="15"/>
    <text class="txt badgeTxt" x="428" y="241" text-anchor="middle">3</text>
    <circle class="badge" cx="114" cy="376" r="15"/>
    <text class="txt badgeTxt" x="114" y="381" text-anchor="middle">4</text>
    <circle class="badge" cx="254" cy="376" r="15"/>
    <text class="txt badgeTxt" x="254" y="381" text-anchor="middle">5</text>
    <circle class="badge" cx="428" cy="376" r="15"/>
    <text class="txt badgeTxt" x="428" y="381" text-anchor="middle">6</text>

    <text class="txt small" x="277" y="500" text-anchor="middle">Orden: A, B, C, D, E, F</text>
    <text class="txt small" x="277" y="525" text-anchor="middle">Cola FIFO: agota el nivel de A</text>
    <text class="txt small" x="277" y="550" text-anchor="middle">(B y C) antes de bajar al siguiente.</text>
  </g>

  <!-- ================= PANEL DFS ================= -->
  <g transform="translate(615,30)">
    <!-- aristas del grafo (todas), atenuadas -->
    <path class="dim" d="M277 130 L150 260"/>
    <path class="dim" d="M277 130 L404 260"/>
    <path class="dim" d="M150 260 L90 400"/>
    <path class="dim" d="M150 260 L230 400"/>
    <path class="dim" d="M404 260 L404 400"/>
    <path class="dim" d="M230 400 L404 400"/>

    <!-- vertices -->
    <circle class="node" cx="277" cy="130" r="34"/>
    <circle class="node" cx="150" cy="260" r="34"/>
    <circle class="node" cx="404" cy="260" r="34"/>
    <circle class="node" cx="90" cy="400" r="34"/>
    <circle class="node" cx="230" cy="400" r="34"/>
    <circle class="node" cx="404" cy="400" r="34"/>

    <text class="txt label" x="277" y="139" text-anchor="middle">A</text>
    <text class="txt label" x="150" y="269" text-anchor="middle">B</text>
    <text class="txt label" x="404" y="269" text-anchor="middle">C</text>
    <text class="txt label" x="90" y="409" text-anchor="middle">D</text>
    <text class="txt label" x="230" y="409" text-anchor="middle">E</text>
    <text class="txt label" x="404" y="409" text-anchor="middle">F</text>

    <!-- arbol de descubrimiento DFS: A-B, B-D, B-E, E-F, F-C (A-C queda sin usar) -->
    <path class="tree" d="M253.24 154.32 L173.76 235.68"/>
    <path class="tree" d="M136.61 291.25 L103.39 368.75"/>
    <path class="tree" d="M166.87 289.52 L213.13 370.48"/>
    <path class="tree" d="M264 400 L370 400"/>
    <path class="tree" d="M404 366 L404 294"/>

    <!-- orden de visita -->
    <circle class="badge" cx="301" cy="106" r="15"/>
    <text class="txt badgeTxt" x="301" y="111" text-anchor="middle">1</text>
    <circle class="badge" cx="174" cy="236" r="15"/>
    <text class="txt badgeTxt" x="174" y="241" text-anchor="middle">2</text>
    <circle class="badge" cx="114" cy="376" r="15"/>
    <text class="txt badgeTxt" x="114" y="381" text-anchor="middle">3</text>
    <circle class="badge" cx="254" cy="376" r="15"/>
    <text class="txt badgeTxt" x="254" y="381" text-anchor="middle">4</text>
    <circle class="badge" cx="428" cy="376" r="15"/>
    <text class="txt badgeTxt" x="428" y="381" text-anchor="middle">5</text>
    <circle class="badge" cx="428" cy="236" r="15"/>
    <text class="txt badgeTxt" x="428" y="241" text-anchor="middle">6</text>

    <text class="txt small" x="277" y="500" text-anchor="middle">Orden: A, B, D, E, F, C</text>
    <text class="txt small" x="277" y="525" text-anchor="middle">Pila LIFO: se hunde por B-D-E-F</text>
    <text class="txt small" x="277" y="550" text-anchor="middle">y recien al final llega a C.</text>
  </g>
</svg>
