<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <style>
    .line { stroke: #222; stroke-width: 3; fill: none; }
    .node { fill: white; stroke: #222; stroke-width: 3; }
    .value { font-family: Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #222; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- Aristas -->
  <line class="line" x1="300" y1="100" x2="180" y2="260"/>
  <line class="line" x1="300" y1="100" x2="420" y2="260"/>

  <!-- Nodos -->
  <circle class="node" cx="300" cy="100" r="42"/>
  <circle class="node" cx="180" cy="260" r="42"/>
  <circle class="node" cx="420" cy="260" r="42"/>

  <!-- Valores -->
  <text class="value" x="300" y="100">8</text>
  <text class="value" x="180" y="260">3</text>
  <text class="value" x="420" y="260">10</text>
</svg>
