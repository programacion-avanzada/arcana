<svg width="580" height="200" viewBox="0 0 580 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame       { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.8; }
    .divider     { stroke: #9baec8; stroke-width: 1; }
    .val         { font-size: 20px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .ghost       { fill: #f5f7fa; fill-opacity: 0.5; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .ghost-val   { font-size: 16px; font-weight: 700; fill: #555555; text-anchor: middle; }
    .op          { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .op-arrow    { stroke: #777777; stroke-width: 1.5; fill: none; }
    .op-arrow-fill { fill: #777777; }
    @media (prefers-color-scheme: dark) {
      .frame       { fill: #1e2330; stroke: #4a6fa5; }
      .divider     { stroke: #4a6fa5; }
      .val         { fill: #e2e8f0; }
      .ghost       { fill: #1e2330; stroke: #8899aa; }
      .ghost-val   { fill: #aab4c0; }
      .op            { fill: #8899aa; }
      .op-arrow      { stroke: #8899aa; }
      .op-arrow-fill { fill: #8899aa; }
    }
  </style>

  <!-- deque: tubo abierto en ambos extremos, mismo contenedor contiguo que un array -->
  <rect x="150" y="85" width="280" height="90" rx="10" class="frame"/>
  <line x1="220" y1="85" x2="220" y2="175" class="divider"/>
  <line x1="290" y1="85" x2="290" y2="175" class="divider"/>
  <line x1="360" y1="85" x2="360" y2="175" class="divider"/>

  <text x="185" y="136" class="val">8</text>
  <text x="255" y="136" class="val">3</text>
  <text x="325" y="136" class="val">15</text>
  <text x="395" y="136" class="val">6</text>

  <!-- appendleft: entra por el extremo izquierdo -->
  <text x="65" y="88" class="op">appendleft</text>
  <rect x="15" y="96" width="100" height="32" rx="6" class="ghost"/>
  <text x="65" y="117" class="ghost-val">9</text>
  <path d="M115,112 L148,112" class="op-arrow"/>
  <path d="M142,105 L155,112 L142,119 Z" class="op-arrow-fill"/>

  <!-- popleft: sale por el extremo izquierdo -->
  <text x="65" y="140" class="op">popleft</text>
  <rect x="15" y="148" width="100" height="32" rx="6" class="ghost"/>
  <text x="65" y="169" class="ghost-val">8</text>
  <path d="M148,148 L119,148" class="op-arrow"/>
  <path d="M125,141 L112,148 L125,155 Z" class="op-arrow-fill"/>

  <!-- append: entra por el extremo derecho -->
  <text x="495" y="88" class="op">append</text>
  <rect x="445" y="96" width="100" height="32" rx="6" class="ghost"/>
  <text x="495" y="117" class="ghost-val">4</text>
  <path d="M445,112 L432,112" class="op-arrow"/>
  <path d="M438,105 L425,112 L438,119 Z" class="op-arrow-fill"/>

  <!-- pop: sale por el extremo derecho -->
  <text x="495" y="140" class="op">pop</text>
  <rect x="445" y="148" width="100" height="32" rx="6" class="ghost"/>
  <text x="495" y="169" class="ghost-val">6</text>
  <path d="M432,148 L443,148" class="op-arrow"/>
  <path d="M437,141 L450,148 L437,155 Z" class="op-arrow-fill"/>
</svg>
