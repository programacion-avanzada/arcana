<svg width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame       { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.8; }
    .divider     { stroke: #9baec8; stroke-width: 1; }
    .val-sm      { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .idx         { font-size: 12px; fill: #777777; text-anchor: middle; }
    .top-label   { font-size: 13px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .top-arrow   { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .top-arrow-fill { fill: #c0742a; }
    @media (prefers-color-scheme: dark) {
      .frame       { fill: #1e2330; stroke: #4a6fa5; }
      .divider     { stroke: #4a6fa5; }
      .val-sm      { fill: #e2e8f0; }
      .idx         { fill: #8899aa; }
      .top-label   { fill: #d4884a; }
      .top-arrow   { stroke: #d4884a; }
      .top-arrow-fill { fill: #d4884a; }
    }
  </style>

  <!-- hashset: array de 8 slots con direccionamiento abierto -->
  <rect x="20" y="90" width="520" height="60" rx="8" class="frame"/>
  <line x1="85"  y1="90" x2="85"  y2="150" class="divider"/>
  <line x1="150" y1="90" x2="150" y2="150" class="divider"/>
  <line x1="215" y1="90" x2="215" y2="150" class="divider"/>
  <line x1="280" y1="90" x2="280" y2="150" class="divider"/>
  <line x1="345" y1="90" x2="345" y2="150" class="divider"/>
  <line x1="410" y1="90" x2="410" y2="150" class="divider"/>
  <line x1="475" y1="90" x2="475" y2="150" class="divider"/>

  <text x="53"  y="168" class="idx">0</text>
  <text x="118" y="168" class="idx">1</text>
  <text x="183" y="168" class="idx">2</text>
  <text x="248" y="168" class="idx">3</text>
  <text x="313" y="168" class="idx">4</text>
  <text x="378" y="168" class="idx">5</text>
  <text x="443" y="168" class="idx">6</text>
  <text x="508" y="168" class="idx">7</text>

  <!-- slot 1: "ab" -->
  <rect x="87" y="92" width="61" height="56" rx="4" class="top-arrow"/>
  <text x="118" y="127" class="val-sm">"ab"</text>
  <text x="118" y="72" class="top-label">= 1</text>
  <path d="M118,78 L118,86" class="top-arrow"/>
  <path d="M112,86 L118,94 L124,86 Z" class="top-arrow-fill"/>

  <!-- slot 3: "xy" -->
  <rect x="217" y="92" width="61" height="56" rx="4" class="top-arrow"/>
  <text x="248" y="127" class="val-sm">"xy"</text>
  <text x="248" y="72" class="top-label">= 3</text>
  <path d="M248,78 L248,86" class="top-arrow"/>
  <path d="M242,86 L248,94 L254,86 Z" class="top-arrow-fill"/>

  <!-- slot 5: "cd" -->
  <rect x="347" y="92" width="61" height="56" rx="4" class="top-arrow"/>
  <text x="378" y="127" class="val-sm">"cd"</text>
  <text x="378" y="72" class="top-label">= 5</text>
  <path d="M378,78 L378,86" class="top-arrow"/>
  <path d="M372,86 L378,94 L384,86 Z" class="top-arrow-fill"/>

  <!-- slot 7: "hi" -->
  <rect x="477" y="92" width="61" height="56" rx="4" class="top-arrow"/>
  <text x="508" y="127" class="val-sm">"hi"</text>
  <text x="508" y="72" class="top-label">= 7</text>
  <path d="M508,78 L508,86" class="top-arrow"/>
  <path d="M502,86 L508,94 L514,86 Z" class="top-arrow-fill"/>
</svg>
