<svg width="660" height="340" viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame       { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.8; }
    .divider     { stroke: #9baec8; stroke-width: 1; }
    .val         { font-size: 18px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .val-sm      { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .idx         { font-size: 12px; fill: #777777; text-anchor: middle; }
    .op          { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .op-arrow    { stroke: #777777; stroke-width: 1.5; fill: none; }
    .op-arrow-fill { fill: #777777; }
    .link        { stroke: #9baec8; stroke-width: 1.8; fill: none; }
    .link-fill   { fill: #9baec8; }
    .query       { fill: #f5f7fa; stroke: #c0742a; stroke-width: 1.8; }
    .top-label   { font-size: 13px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .top-arrow   { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .top-arrow-fill { fill: #c0742a; }
    @media (prefers-color-scheme: dark) {
      .frame       { fill: #1e2330; stroke: #4a6fa5; }
      .divider     { stroke: #4a6fa5; }
      .val, .val-sm { fill: #e2e8f0; }
      .idx         { fill: #8899aa; }
      .op          { fill: #8899aa; }
      .op-arrow    { stroke: #8899aa; }
      .op-arrow-fill { fill: #8899aa; }
      .link        { stroke: #4a6fa5; }
      .link-fill   { fill: #4a6fa5; }
      .query       { fill: #1e2330; stroke: #d4884a; }
      .top-label   { fill: #d4884a; }
      .top-arrow   { stroke: #d4884a; }
      .top-arrow-fill { fill: #d4884a; }
    }
  </style>

  <!-- clave de entrada -->
  <text x="65" y="132" class="op">clave</text>
  <rect x="20" y="140" width="90" height="36" rx="6" class="query"/>
  <text x="65" y="163" class="val-sm">"abel"</text>

  <!-- función hash -->
  <rect x="160" y="140" width="90" height="36" rx="6" class="frame"/>
  <text x="205" y="163" class="val">h(x)</text>
  <path d="M110,158 L156,158" class="op-arrow"/>
  <path d="M152,165 L165,158 L152,151 Z" class="op-arrow-fill"/>

  <!-- resultado: el indice donde cae la clave -->
  <path d="M250,158 L376,235" class="top-arrow"/>
  <path d="M369,238 L384,239 L377,226 Z" class="top-arrow-fill"/>
  <text x="320" y="192" class="top-label">= 5</text>

  <!-- vector de buckets (indice | contenido) -->
  <rect x="380" y="60" width="140" height="256" rx="10" class="frame"/>
  <line x1="420" y1="60"  x2="420" y2="316" class="divider"/>
  <line x1="380" y1="92"  x2="520" y2="92"  class="divider"/>
  <line x1="380" y1="124" x2="520" y2="124" class="divider"/>
  <line x1="380" y1="156" x2="520" y2="156" class="divider"/>
  <line x1="380" y1="188" x2="520" y2="188" class="divider"/>
  <line x1="380" y1="220" x2="520" y2="220" class="divider"/>
  <line x1="380" y1="252" x2="520" y2="252" class="divider"/>
  <line x1="380" y1="284" x2="520" y2="284" class="divider"/>

  <text x="400" y="80"  class="idx">0</text>
  <text x="400" y="112" class="idx">1</text>
  <text x="400" y="144" class="idx">2</text>
  <text x="400" y="176" class="idx">3</text>
  <text x="400" y="208" class="idx">4</text>
  <text x="400" y="240" class="idx">5</text>
  <text x="400" y="272" class="idx">6</text>
  <text x="400" y="304" class="idx">7</text>

  <!-- bucket 5: donde h("abel") aterrizó -->
  <rect x="382" y="222" width="136" height="28" rx="6" class="top-arrow"/>
  <text x="470" y="241" class="val-sm">"abel"</text>

  <!-- colision: "cain" tambien hashea a 5, se encadena -->
  <text x="595" y="205" class="op">colisión</text>
  <path d="M520,236 L550,236" class="link"/>
  <path d="M552,243 L565,236 L552,229 Z" class="link-fill"/>
  <rect x="560" y="220" width="70" height="32" rx="6" class="frame"/>
  <text x="595" y="241" class="val-sm">"cain"</text>
</svg>
