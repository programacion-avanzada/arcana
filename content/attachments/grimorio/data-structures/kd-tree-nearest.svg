<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 419" width="760" role="img" aria-labelledby="ttl desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="ttl">Poda en la búsqueda del vecino más cercano en un k-d tree</title>
<desc id="desc">Dos paneles con los mismos siete puntos y cortes. En A la consulta (7,11) descarta subárboles porque el círculo de búsqueda no cruza los cortes. En B la consulta (12,6) cruza el corte x=11 y el vecino más cercano (9,4) está del otro lado.</desc>
<style>
 text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6e7781; }
 .t { font-size: 14px; font-weight: 600; } .s { font-size: 11px; }
 .frame { fill: none; stroke: #8b949e; stroke-width: 1; }
 .pruned { fill: #8b949e; opacity: .18; }
 .cut { stroke: #8b949e; stroke-width: 1.4; stroke-dasharray: 5 4; }
 .cl { font-size: 10.5px; }
 .ring { fill: #fb8500; fill-opacity: .08; stroke: #fb8500; stroke-width: 1.6; stroke-dasharray: 4 3; }
 .dist { stroke: #fb8500; stroke-width: 1.4; } .dl { font-size: 11px; font-weight: 600; fill: #d97100; }
 .vis { fill: #2f81f7; } .prn { fill: none; stroke: #8b949e; stroke-width: 1.5; }
 .win { fill: none; stroke: #2da44e; stroke-width: 2.2; }
 .q { fill: #fb8500; stroke: #fb8500; } .ql { font-size: 11px; font-weight: 600; fill: #d97100; }
 .pl { font-size: 10.5px; } .vist { fill: #3a7bd5; } .prnt { fill: #6e7781; }
 .lg { font-size: 11px; }
</style>
<text x="30" y="32" class="t">A. El círculo no cruza ningún corte</text>
<text x="30" y="50" class="s">Se podan 4 de 7 puntos: radio 2 &lt; distancia 4 al corte</text>
<rect x="30" y="70" width="306" height="255" class="frame"/>
<rect x="217" y="70" width="119" height="255" class="pruned"/>
<rect x="30" y="206" width="187" height="119" class="pruned"/>
<line x1="217" y1="325" x2="217" y2="70" class="cut"/>
<line x1="30" y1="206" x2="217" y2="206" class="cut"/>
<line x1="217" y1="155" x2="336" y2="155" class="cut"/>
<text x="221" y="82" class="cl">x = 11</text>
<text x="34" y="202" class="cl">y = 7</text>
<text x="222" y="151" class="cl">y = 10</text>
<circle cx="149" cy="138" r="34.0" class="ring"/>
<line x1="149" y1="138" x2="217" y2="138" class="dist"/>
<text x="200" y="133" class="dl" text-anchor="middle">d = 4</text>
<circle cx="98" cy="206" r="4.5" class="vis"/>
<text x="107" y="222" class="pl vist" text-anchor="start">(4,7)</text>
<circle cx="149" cy="104" r="9" class="win"/>
<circle cx="149" cy="104" r="4.5" class="vis"/>
<text x="157" y="98" class="pl vist" text-anchor="start">(7,13)</text>
<circle cx="183" cy="257" r="4.5" class="prn"/>
<text x="173" y="261" class="pl prnt" text-anchor="end">(9,4)</text>
<circle cx="217" cy="155" r="4.5" class="vis"/>
<text x="209" y="171" class="pl vist" text-anchor="end">(11,10)</text>
<circle cx="268" cy="138" r="4.5" class="prn"/>
<text x="268" y="128" class="pl prnt" text-anchor="middle">(14,11)</text>
<circle cx="285" cy="274" r="4.5" class="prn"/>
<text x="294" y="278" class="pl prnt" text-anchor="start">(15,3)</text>
<circle cx="302" cy="155" r="4.5" class="prn"/>
<text x="302" y="175" class="pl prnt" text-anchor="middle">(16,10)</text>
<path d="M149 131 L156 138 L149 145 L142 138 Z" class="q"/>
<text x="149" y="160" class="ql" text-anchor="middle">q=(7,11)</text>
<text x="410" y="32" class="t">B. El círculo cruza el corte x = 11</text>
<text x="410" y="50" class="s">Hay que mirar el otro lado: ahí está el ganador, (9,4)</text>
<rect x="410" y="70" width="306" height="255" class="frame"/>
<line x1="597" y1="325" x2="597" y2="70" class="cut"/>
<line x1="410" y1="206" x2="597" y2="206" class="cut"/>
<line x1="597" y1="155" x2="716" y2="155" class="cut"/>
<text x="601" y="82" class="cl">x = 11</text>
<text x="414" y="202" class="cl">y = 7</text>
<text x="602" y="151" class="cl">y = 10</text>
<circle cx="614" cy="223" r="61.3" class="ring"/>
<line x1="614" y1="223" x2="597" y2="223" class="dist"/>
<text x="592.75" y="218" class="dl" text-anchor="end">d = 1</text>
<circle cx="478" cy="206" r="4.5" class="vis"/>
<text x="487" y="222" class="pl vist" text-anchor="start">(4,7)</text>
<circle cx="529" cy="104" r="4.5" class="vis"/>
<text x="537" y="98" class="pl vist" text-anchor="start">(7,13)</text>
<circle cx="563" cy="257" r="9" class="win"/>
<circle cx="563" cy="257" r="4.5" class="vis"/>
<text x="553" y="261" class="pl vist" text-anchor="end">(9,4)</text>
<circle cx="597" cy="155" r="4.5" class="vis"/>
<text x="589" y="147" class="pl vist" text-anchor="end">(11,10)</text>
<circle cx="648" cy="138" r="4.5" class="vis"/>
<text x="648" y="128" class="pl vist" text-anchor="middle">(14,11)</text>
<circle cx="665" cy="274" r="4.5" class="vis"/>
<text x="674" y="278" class="pl vist" text-anchor="start">(15,3)</text>
<circle cx="682" cy="155" r="4.5" class="vis"/>
<text x="682" y="175" class="pl vist" text-anchor="middle">(16,10)</text>
<path d="M614 216 L621 223 L614 230 L607 223 Z" class="q"/>
<text x="614" y="245" class="ql" text-anchor="middle">q=(12,6)</text>

<g transform="translate(30,363)">
  <circle cx="6" cy="0" r="4.5" class="vis"/><text x="16" y="4" class="lg">punto visitado</text>
  <circle cx="140" cy="0" r="4.5" class="prn"/><text x="150" y="4" class="lg">podado en esta búsqueda</text>
  <circle cx="310" cy="0" r="9" class="win"/><circle cx="310" cy="0" r="4.5" class="vis"/><text x="326" y="4" class="lg">vecino más cercano</text>
  <path d="M458 -6 L464 0 L458 6 L452 0 Z" class="q"/><text x="472" y="4" class="lg">consulta q</text>
  <circle cx="566" cy="0" r="6" class="ring"/><text x="578" y="4" class="lg">radio = mejor distancia</text>
</g>
<text x="30" y="389" class="lg">Se visita un subárbol lejano solo si (consulta[eje] − nodo[eje])² &lt; mejor_distancia².</text>
<text x="30" y="405" class="lg">Líneas punteadas: cortes del k-d tree. Zonas grises: regiones podadas en esta búsqueda (el árbol no se modifica).</text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
