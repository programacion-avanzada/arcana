<svg width="720" height="190" viewBox="0 0 720 190" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame       { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.8; }
    .divider     { stroke: #9baec8; stroke-width: 1; }
    .val         { font-size: 18px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .op          { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .link        { stroke: #9baec8; stroke-width: 1.8; fill: none; }
    .link-fill   { fill: #9baec8; }
    .top-label   { font-size: 13px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .top-arrow   { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .top-arrow-fill { fill: #c0742a; }
    @media (prefers-color-scheme: dark) {
      .frame       { fill: #1e2330; stroke: #4a6fa5; }
      .divider     { stroke: #4a6fa5; }
      .val         { fill: #e2e8f0; }
      .op            { fill: #8899aa; }
      .link        { stroke: #4a6fa5; }
      .link-fill   { fill: #4a6fa5; }
      .top-label   { fill: #d4884a; }
      .top-arrow   { stroke: #d4884a; }
      .top-arrow-fill { fill: #d4884a; }
    }
  </style>

  <!-- head: apunta al primer nodo -->
  <text x="200" y="52" class="top-label">head</text>
  <path d="M200,60 L200,84" class="top-arrow"/>
  <path d="M194,80 L200,92 L206,80 Z" class="top-arrow-fill"/>

  <!-- tail: apunta al ultimo nodo -->
  <text x="520" y="52" class="top-label">tail</text>
  <path d="M520,60 L520,84" class="top-arrow"/>
  <path d="M514,80 L520,92 L526,80 Z" class="top-arrow-fill"/>

  <!-- nodo 1: prev | dato | next -->
  <rect x="140" y="90" width="120" height="60" rx="8" class="frame"/>
  <line x1="170" y1="90" x2="170" y2="150" class="divider"/>
  <line x1="230" y1="90" x2="230" y2="150" class="divider"/>
  <text x="200" y="127" class="val">4</text>

  <!-- nodo 2: prev | dato | next -->
  <rect x="300" y="90" width="120" height="60" rx="8" class="frame"/>
  <line x1="330" y1="90" x2="330" y2="150" class="divider"/>
  <line x1="390" y1="90" x2="390" y2="150" class="divider"/>
  <text x="360" y="127" class="val">9</text>

  <!-- nodo 3: prev | dato | next -->
  <rect x="460" y="90" width="120" height="60" rx="8" class="frame"/>
  <line x1="490" y1="90" x2="490" y2="150" class="divider"/>
  <line x1="550" y1="90" x2="550" y2="150" class="divider"/>
  <text x="520" y="127" class="val">15</text>

  <!-- prev/next bidireccional: nodo1 <-> nodo2 -->
  <path d="M260,120 L300,120" class="link"/>
  <path d="M292,127 L305,120 L292,113 Z" class="link-fill"/>
  <path d="M268,127 L255,120 L268,113 Z" class="link-fill"/>

  <!-- prev/next bidireccional: nodo2 <-> nodo3 -->
  <path d="M420,120 L460,120" class="link"/>
  <path d="M452,127 L465,120 L452,113 Z" class="link-fill"/>
  <path d="M428,127 L415,120 L428,113 Z" class="link-fill"/>

  <!-- limites de la lista -->
  <path d="M140,120 L108,120" class="link"/>
  <path d="M113,127 L100,120 L113,113 Z" class="link-fill"/>
  <text x="75" y="124" class="op">null</text>

  <path d="M580,120 L612,120" class="link"/>
  <path d="M607,127 L620,120 L607,113 Z" class="link-fill"/>
  <text x="645" y="124" class="op">null</text>
</svg>
