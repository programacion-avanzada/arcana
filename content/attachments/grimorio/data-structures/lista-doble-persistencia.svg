<svg width="720" height="415" viewBox="0 0 720 415" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame      { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.5; }
