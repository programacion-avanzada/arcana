<svg width="580" height="220" viewBox="0 0 580 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame       { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.8; }
    .divider     { stroke: #9baec8; stroke-width: 1; }
    .val         { font-size: 20px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .op          { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .link        { stroke: #9baec8; stroke-width: 1.8; fill: none; }
    .link-fill   { fill: #9baec8; }
    .top-label   { font-size: 13px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .top-arrow   { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .top-arrow-fill { fill: #c0742a; }
    @media (prefers-color-scheme: dark) {
      .frame       { fill: #1e2330; stroke: #4a6fa5; }
      .divider     { stroke: #4a6fa5; }
      .val         { fill: #e2e8f0; }
      .op          { fill: #8899aa; }
      .link        { stroke: #4a6fa5; }
      .link-fill   { fill: #4a6fa5; }
      .top-label   { fill: #d4884a; }
      .top-arrow   { stroke: #d4884a; }
      .top-arrow-fill { fill: #d4884a; }
    }
  </style>

  <!-- head: puntero externo al primer nodo -->
  <text x="145" y="52" class="top-label">head</text>
  <path d="M145,60 L145,84" class="top-arrow"/>
  <path d="M138,80 L145,92 L152,80 Z" class="top-arrow-fill"/>

  <!-- nodo 0: dato | puntero -->
  <rect x="110" y="90" width="110" height="60" rx="8" class="frame"/>
  <line x1="180" y1="90" x2="180" y2="150" class="divider"/>
  <text x="145" y="127" class="val">4</text>

  <!-- nodo 1: dato | puntero -->
  <rect x="270" y="90" width="110" height="60" rx="8" class="frame"/>
  <line x1="340" y1="90" x2="340" y2="150" class="divider"/>
  <text x="305" y="127" class="val">9</text>

  <!-- nodo 2: dato | puntero -->
  <rect x="430" y="90" width="110" height="60" rx="8" class="frame"/>
  <line x1="500" y1="90" x2="500" y2="150" class="divider"/>
  <text x="465" y="127" class="val">15</text>

  <!-- next: nodo0 -> nodo1 -->
  <path d="M220,120 L260,120" class="link"/>
  <path d="M262,127 L275,120 L262,113 Z" class="link-fill"/>

  <!-- next: nodo1 -> nodo2 -->
  <path d="M380,120 L420,120" class="link"/>
  <path d="M422,127 L435,120 L422,113 Z" class="link-fill"/>

  <!-- next: nodo2 -> null, fin de la lista -->
  <text x="520" y="124" class="op">null</text>
</svg>
