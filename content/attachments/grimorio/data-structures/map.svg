<svg width="520" height="340" viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame       { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.8; }
    .divider     { stroke: #9baec8; stroke-width: 1; }
    .val-sm      { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .ghost       { fill: #f5f7fa; fill-opacity: 0.5; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .ghost-val   { font-size: 16px; font-weight: 700; fill: #555555; text-anchor: middle; }
    .op          { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .op-arrow    { stroke: #777777; stroke-width: 1.5; fill: none; }
    .op-arrow-fill { fill: #777777; }
    .top-label   { font-size: 13px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .top-arrow   { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .query       { fill: #f5f7fa; stroke: #c0742a; stroke-width: 1.8; }
    @media (prefers-color-scheme: dark) {
      .frame       { fill: #1e2330; stroke: #4a6fa5; }
      .divider     { stroke: #4a6fa5; }
      .val-sm      { fill: #e2e8f0; }
      .ghost       { fill: #1e2330; stroke: #8899aa; }
      .ghost-val   { fill: #aab4c0; }
      .op          { fill: #8899aa; }
      .op-arrow    { stroke: #8899aa; }
      .op-arrow-fill { fill: #8899aa; }
      .top-label   { fill: #d4884a; }
      .top-arrow   { stroke: #d4884a; }
      .query       { fill: #1e2330; stroke: #d4884a; }
    }
  </style>

  <!-- mapa: tabla clave -> valor -->
  <rect x="110" y="70" width="260" height="180" rx="10" class="frame"/>
  <line x1="220" y1="70"  x2="220" y2="250" class="divider"/>
  <line x1="110" y1="106" x2="370" y2="106" class="divider"/>
  <line x1="110" y1="142" x2="370" y2="142" class="divider"/>
  <line x1="110" y1="178" x2="370" y2="178" class="divider"/>
  <line x1="110" y1="214" x2="370" y2="214" class="divider"/>

  <text x="165" y="93" class="op">clave</text>
  <text x="295" y="93" class="op">valor</text>

  <text x="165" y="129" class="val-sm">nombre</text>
  <text x="295" y="129" class="val-sm">"Alicia"</text>

  <text x="165" y="165" class="val-sm">edad</text>
  <text x="295" y="165" class="val-sm">30</text>

  <text x="165" y="201" class="val-sm">ciudad</text>
  <text x="295" y="201" class="val-sm">"Córdoba"</text>

  <text x="165" y="237" class="val-sm">activo</text>
  <text x="295" y="237" class="val-sm">true</text>

  <!-- find: busca por clave, no modifica el mapa -->
  <rect x="112" y="144" width="256" height="32" rx="6" class="top-arrow"/>
  <text x="50" y="138" class="top-label">find</text>
  <rect x="20" y="146" width="60" height="28" rx="6" class="query"/>
  <text x="50" y="165" class="val-sm">edad</text>
  <path d="M80,160 L108,160" class="op-arrow"/>
  <path d="M102,153 L115,160 L102,167 Z" class="op-arrow-fill"/>

  <!-- insert: un nuevo par entra al mapa -->
  <text x="75" y="262" class="op">insert</text>
  <rect x="20" y="270" width="110" height="36" rx="6" class="ghost"/>
  <text x="75" y="284" class="ghost-val">país</text>
  <text x="75" y="300" class="op">"Argentina"</text>
  <path d="M128,268 L146,252" class="op-arrow"/>
  <path d="M144,263 L150,249 L135,252 Z" class="op-arrow-fill"/>

  <!-- delete: la entrada activo sale del mapa -->
  <text x="445" y="202" class="op">delete</text>
  <rect x="390" y="210" width="110" height="44" rx="6" class="ghost"/>
  <text x="445" y="228" class="ghost-val">activo</text>
  <text x="445" y="244" class="op">true</text>
  <path d="M372,233 L388,229" class="op-arrow"/>
  <path d="M382,238 L393,228 L379,224 Z" class="op-arrow-fill"/>
</svg>
