<svg xmlns="http://www.w3.org/2000/svg" width="630" height="350" viewBox="0 0 630 350">
<style>
  .t{fill:#f1f3f5;font-family:Consolas,"Courier New",monospace;font-size:17px}
  .h{font-weight:700}
  .g{stroke:#59616b;stroke-width:1.2}
</style>

<rect width="630" height="350" fill="#111315"/>

<!-- Tabla -->
<rect x="55" y="22" width="492" height="265" rx="9"
      fill="#191c20" stroke="#c8ced7" stroke-width="1.5"/>

<!-- Columnas -->
<line x1="153" y1="22" x2="153" y2="287" class="g"/>
<line x1="251" y1="22" x2="251" y2="287" class="g"/>
<line x1="349" y1="22" x2="349" y2="287" class="g"/>
<line x1="447" y1="22" x2="447" y2="287" class="g"/>

<!-- Filas -->
<line x1="55" y1="75" x2="547" y2="75" class="g"/>
<line x1="55" y1="128" x2="547" y2="128" class="g"/>
<line x1="55" y1="181" x2="547" y2="181" class="g"/>
<line x1="55" y1="234" x2="547" y2="234" class="g"/>

<!-- Encabezados -->
<text x="202" y="55" text-anchor="middle" class="t h">A</text>
<text x="300" y="55" text-anchor="middle" class="t h">B</text>
<text x="398" y="55" text-anchor="middle" class="t h">C</text>
<text x="496" y="55" text-anchor="middle" class="t h">D</text>

<text x="104" y="108" text-anchor="middle" class="t h">A</text>
<text x="104" y="161" text-anchor="middle" class="t h">B</text>
<text x="104" y="214" text-anchor="middle" class="t h">C</text>
<text x="104" y="267" text-anchor="middle" class="t h">D</text>

<!-- Valores -->
<g class="t">
<text x="202" y="108" text-anchor="middle">0</text>
<text x="300" y="108" text-anchor="middle">1</text>
<text x="398" y="108" text-anchor="middle">1</text>
<text x="496" y="108" text-anchor="middle">0</text>

<text x="202" y="161" text-anchor="middle">1</text>
<text x="300" y="161" text-anchor="middle">0</text>
<text x="398" y="161" text-anchor="middle">1</text>
<text x="496" y="161" text-anchor="middle">0</text>

<text x="202" y="214" text-anchor="middle">0</text>
<text x="300" y="214" text-anchor="middle">0</text>
<text x="398" y="214" text-anchor="middle">0</text>
<text x="496" y="214" text-anchor="middle">1</text>

<text x="202" y="267" text-anchor="middle">0</text>
<text x="300" y="267" text-anchor="middle">0</text>
<text x="398" y="267" text-anchor="middle">1</text>
<text x="496" y="267" text-anchor="middle">0</text>
</g>

<!-- Explicación -->
<text x="301" y="327" text-anchor="middle"
      fill="#dbe4f0" font-family="Consolas,'Courier New',monospace" font-size="13">
  M[i, j] = 1 si hay una arista de i a j, 0 en caso contrario.
</text>
</svg>