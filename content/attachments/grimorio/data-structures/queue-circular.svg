<svg width="600" height="350" viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame       { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.8; }
    .divider     { stroke: #9baec8; stroke-width: 1; }
    .val         { font-size: 20px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .idx         { font-size: 12px; fill: #777777; text-anchor: middle; }
    .ann         { font-size: 11px; fill: #777777; text-anchor: middle; }
    .op          { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: start; }
    .op-end      { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: end; }
    .ghost       { fill: #f5f7fa; fill-opacity: 0.5; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .ghost-val   { font-size: 16px; font-weight: 700; fill: #555555; text-anchor: middle; }
    .top-label   { font-size: 13px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .top-arrow   { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .top-arrow-fill { fill: #c0742a; }
    .wrap-line   { stroke: #c0742a; stroke-width: 1.8; fill: none; stroke-dasharray: 5,4; }
    .wrap-fill   { fill: #c0742a; }
    .wrap-label  { font-size: 12px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .frame       { fill: #1e2330; stroke: #4a6fa5; }
      .divider     { stroke: #4a6fa5; }
      .val         { fill: #e2e8f0; }
      .idx         { fill: #8899aa; }
      .ann         { fill: #8899aa; }
      .op          { fill: #8899aa; }
      .op-end      { fill: #8899aa; }
      .ghost       { fill: #1e2330; stroke: #8899aa; }
      .ghost-val   { fill: #aab4c0; }
      .top-label   { fill: #d4884a; }
      .top-arrow   { stroke: #d4884a; }
      .top-arrow-fill { fill: #d4884a; }
      .wrap-line   { stroke: #d4884a; }
      .wrap-fill   { fill: #d4884a; }
      .wrap-label  { fill: #d4884a; }
    }
  </style>

  <text x="60" y="30" class="op">capacidad: 6 | size: 5</text>
  <text x="540" y="30" class="op-end">orden de salida: C → D → E → F → G</text>

  <!-- front: apunta al elemento mas antiguo (posicion 2) -->
  <text x="260" y="66" class="ann">próximo en salir</text>
  <text x="260" y="86" class="top-label">front</text>
  <path d="M260,92 L260,106" class="top-arrow"/>
  <path d="M254,106 L260,114 L266,106 Z" class="top-arrow-fill"/>

  <!-- arreglo de 6 posiciones -->
  <rect x="60" y="116" width="480" height="60" rx="8" class="frame"/>
  <line x1="140" y1="116" x2="140" y2="176" class="divider"/>
  <line x1="220" y1="116" x2="220" y2="176" class="divider"/>
  <line x1="300" y1="116" x2="300" y2="176" class="divider"/>
  <line x1="380" y1="116" x2="380" y2="176" class="divider"/>
  <line x1="460" y1="116" x2="460" y2="176" class="divider"/>

  <!-- posicion libre: ahi escribe el proximo enqueue -->
  <rect x="143" y="119" width="74" height="54" rx="4" class="ghost"/>
  <text x="180" y="152" class="ghost-val">H</text>

  <!-- contenido actual -->
  <text x="100" y="154" class="val">G</text>
  <text x="260" y="154" class="val">C</text>
  <text x="340" y="154" class="val">D</text>
  <text x="420" y="154" class="val">E</text>
  <text x="500" y="154" class="val">F</text>

  <text x="100" y="196" class="idx">0</text>
  <text x="180" y="196" class="idx">1</text>
  <text x="260" y="196" class="idx">2</text>
  <text x="340" y="196" class="idx">3</text>
  <text x="420" y="196" class="idx">4</text>
  <text x="500" y="196" class="idx">5</text>

  <!-- rear: apunta a la proxima posicion libre (posicion 1) -->
  <path d="M180,214 L180,228" class="top-arrow"/>
  <path d="M174,214 L180,206 L186,214 Z" class="top-arrow-fill"/>
  <text x="180" y="246" class="top-label">rear</text>
  <text x="180" y="262" class="ann">próxima posición libre</text>

  <!-- el salto del final al principio -->
  <path d="M500,286 C 470,318 130,318 100,296" class="wrap-line"/>
  <path d="M94,298 L100,286 L106,298 Z" class="wrap-fill"/>
  <text x="300" y="338" class="wrap-label">(i + 1) % 6</text>
</svg>
