  <path d="M305,95 L315,90 L305,85 Z" class="op-arrow-fill"/>
  <text x="260" y="62" class="op">zig-zag:</text>
  <text x="260" y="78" class="op">rota 10 y 25</text>
  <!-- paso 1 -->
  <text x="422.5" y="22" class="op">20 en la raíz</text>
  <line x1="457" y1="126" x2="478" y2="154" class="link"/>
  <line x1="388" y1="66" x2="367" y2="94" class="link"/>
  <line x1="412" y1="66" x2="433" y2="94" class="link"/>
  <circle cx="355" cy="110" r="20" class="frame"/>
  <text x="355" y="115" class="val-sm">10</text>
  <circle cx="400" cy="50" r="20" class="query"/>
  <text x="400" y="55" class="val-sm">20</text>
  <circle cx="445" cy="110" r="20" class="frame"/>
  <text x="445" y="115" class="val-sm">25</text>
  <circle cx="490" cy="170" r="20" class="frame"/>
  <text x="490" y="175" class="val-sm">30</text>
  <line x1="530" y1="90" x2="630" y2="90" class="op-arrow"/>
  <path d="M630,95 L640,90 L630,85 Z" class="op-arrow-fill"/>
  <text x="585" y="78" class="op">quitar 20</text>
  <!-- paso 2 -->
  <text x="737.5" y="22" class="op">dos subárboles</text>
  <line x1="762" y1="66" x2="783" y2="94" class="link"/>
  <circle cx="680" cy="50" r="20" class="frame"/>
  <text x="680" y="55" class="val-sm">10</text>
  <circle cx="750" cy="50" r="20" class="frame"/>
  <text x="750" y="55" class="val-sm">25</text>
  <circle cx="795" cy="110" r="20" class="frame"/>
  <text x="795" y="115" class="val-sm">30</text>
