  <text x="1030" y="22" class="op">después</text>
  <line x1="1042" y1="126" x2="1063" y2="154" class="link"/>
  <line x1="997" y1="66" x2="1018" y2="94" class="link"/>
  <circle cx="985" cy="50" r="20" class="frame"/>
  <text x="985" y="55" class="val-sm">10</text>
  <circle cx="1030" cy="110" r="20" class="frame"/>
  <text x="1030" y="115" class="val-sm">25</text>
  <circle cx="1075" cy="170" r="20" class="frame"/>
  <text x="1075" y="175" class="val-sm">30</text>
</svg>
