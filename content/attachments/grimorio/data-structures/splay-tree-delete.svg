<svg width="1105" height="210" viewBox="0 0 1105 210" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame        { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.5; }
    .val-sm       { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .link         { stroke: #9baec8; stroke-width: 1.8; fill: none; }
    .op           { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .op-arrow     { stroke: #777777; stroke-width: 1.5; fill: none; }
    .op-arrow-fill { fill: #777777; }
    .query        { fill: #f5f7fa; stroke: #c0742a; stroke-width: 1.8; }
    .ghost        { fill: #f5f7fa; fill-opacity: 0.5; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .ghost-val    { font-size: 15px; font-weight: 700; fill: #555555; text-anchor: middle; }
    .ghost-link   { stroke: #777777; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
    @media (prefers-color-scheme: dark) {
      .frame        { fill: #1e2330; stroke: #4a6fa5; }
      .val-sm       { fill: #e2e8f0; }
      .link         { stroke: #4a6fa5; }
      .op           { fill: #8899aa; }
      .op-arrow     { stroke: #8899aa; }
      .op-arrow-fill { fill: #8899aa; }
      .query        { fill: #1e2330; stroke: #d4884a; }
      .ghost        { fill: #1e2330; stroke: #8899aa; }
      .ghost-val    { fill: #aab4c0; }
      .ghost-link   { stroke: #8899aa; }
    }
  </style>

  <!-- paso 0 -->
  <text x="97.5" y="22" class="op">antes</text>
  <line x1="42" y1="126" x2="63" y2="154" class="link"/>
  <line x1="103.4" y1="61.1" x2="46.6" y2="98.9" class="link"/>
  <line x1="132" y1="66" x2="153" y2="94" class="link"/>
  <circle cx="30" cy="110" r="20" class="frame"/>
  <text x="30" y="115" class="val-sm">10</text>
  <circle cx="75" cy="170" r="20" class="query"/>
  <text x="75" y="175" class="val-sm">20</text>
  <circle cx="120" cy="50" r="20" class="frame"/>
  <text x="120" y="55" class="val-sm">25</text>
  <circle cx="165" cy="110" r="20" class="frame"/>
