  <title id="t">Red de caminos de Caradhras o Moria</title>
  <desc id="d">Grafo dirigido con seis lugares, de Rivendel (0) a Lothlórien (5). Aristas: Rivendel a Caradhras 1, Rivendel a Puertas de Moria 2, Rivendel a Salón de Piedra 6, Puertas de Moria a Salón de Piedra 3, Salón de Piedra a Puerta Este 2, Puerta Este a Lothlórien 1, Caradhras a Lothlórien 8.</desc>
