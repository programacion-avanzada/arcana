<style>
  :root {
    --light: #faf8f8;
    --lightgray: #e5e5e5;
    --gray: #b8b8b8;
    --darkgray: #4e4e4e;
    --dark: #2b2b2b;

    --tertiary: #84a59d;

    --warn: #b7860b;
    --warn-bg: #fbefc9;
    --alert: #b54a3f;
    --alert-bg: #f6dcd8;
    --active-bg: #d3e0ea;
    --done-bg: #dce9e5;
    --on-secondary: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([saved-theme="light"]) {
      --light: #161618;
      --lightgray: #393639;
      --gray: #646464;
      --darkgray: #d4d4d4;
      --dark: #ebebec;
      --secondary: #7b97aa;
      --tertiary: #84a59d;
      --warn: #e3b341;
      --warn-bg: #3b321c;
      --alert: #e07a6f;
      --alert-bg: #3f2422;
      --active-bg: #233340;
      --done-bg: #1f2f2a;

  }
  :root[saved-theme="dark"] {
    --light: #161618;
    --lightgray: #393639;
    --gray: #646464;

    line-height: 1.2;
  }
  a { color: var(--secondary); }

  .pagina { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; }
  .cabecera { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 6px; }

  .pseudo li.titulo { color: var(--secondary); font-weight: 600; }

  /* Grafo */
  .arista { fill: none; stroke: var(--gray); stroke-width: 2; transition: stroke 0.25s, stroke-width 0.25s, opacity 0.25s; }
  .arista.e-arbol { stroke: var(--secondary); stroke-width: 3.5; }
  .arista.e-actual { stroke: var(--warn); stroke-width: 4.5; }
  .arista.e-retroceso { stroke: var(--alert); stroke-width: 3; stroke-dasharray: 7 5; }
  .arista.e-ciclo { stroke: var(--alert); stroke-width: 5; }
  .arista.e-usada { stroke: var(--tertiary); stroke-width: 4.5; }
  .arista.e-tenue { opacity: 0.3; }
  .arista-etiqueta circle { fill: var(--tertiary); }
  .arista-etiqueta text { fill: #ffffff; font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: central; font-family: "Source Sans Pro", system-ui, sans-serif; }
  .marca { fill: var(--gray); }
  .marca-e-arbol { fill: var(--secondary); }
  .marca-e-actual { fill: var(--warn); }
  .marca-e-retroceso, .marca-e-ciclo { fill: var(--alert); }
  .marca-e-usada { fill: var(--tertiary); }

  .nodo rect { fill: var(--light); stroke: var(--gray); stroke-width: 2; transition: fill 0.25s, stroke 0.25s, stroke-width 0.25s; }
  .nodo text { fill: var(--dark); font-size: 14px; text-anchor: middle; dominant-baseline: central; font-family: "Source Sans Pro", system-ui, sans-serif; }
  .nodo.n-espera rect { fill: var(--warn-bg); stroke: var(--warn); }
  .nodo.n-activo rect { fill: var(--active-bg); stroke: var(--secondary); stroke-width: 3.5; }
  .nodo.n-hecho rect { fill: var(--done-bg); stroke: var(--tertiary); }
  .nodo.n-alerta rect { fill: var(--alert-bg); stroke: var(--alert); stroke-width: 3; }
  .nodo.n-tenue { opacity: 0.4; }
  .nodo.aislado rect { stroke-dasharray: 5 4; }
  .insignia circle { fill: var(--secondary); }
  .insignia text { fill: var(--on-secondary); font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: central; font-family: "Source Sans Pro", system-ui, sans-serif; }
  .zona rect { fill: none; stroke: var(--lightgray); stroke-width: 1.5; stroke-dasharray: 6 5; }
  .zona text { fill: var(--gray); font-size: 12px; font-family: "Source Sans Pro", system-ui, sans-serif; }

  .pie { margin-top: 24px; font-size: 0.85rem; color: var(--gray); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
  @media (prefers-reduced-motion: reduce) { .arista, .nodo rect { transition: none; } }
</style>

<script>
// Utilidades compartidas por los ejercicios.
window.Viz = {
  id: function (a, b, dirigido) {
    if (dirigido) return a + ">" + b;
    return a < b ? a + "|" + b : b + "|" + a;
  },
  esc: function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  },
  copia: function (x) { return JSON.parse(JSON.stringify(x)); },
  // Lista de adyacencia en el orden en que aparecen las aristas en la tabla del enunciado.
  adyacencia: function (nodos, aristas, dirigido) {
    var ady = {};
    nodos.forEach(function (n) { ady[n.id] = []; });
    aristas.forEach(function (e) {
      ady[e.a].push(e.b);
      if (!dirigido) ady[e.b].push(e.a);
    });
    return ady;
  },
  fichas: function (ids, nombre, clase, vacio) {
    if (!ids.length) return '<span class="vacio">' + (vacio || "vacía") + "</span>";
    return '<div class="fichas">' + ids.map(function (id, k) {
      var c = typeof clase === "function" ? clase(id, k) : (clase || "");
      return '<span class="ficha ' + c + '">' + Viz.esc(nombre(id)) + "</span>";
    }).join("") + "</div>";
  }
};
</script>
<script>
// La Ronda de Seraph: criterio de Euler (grados) y construcción de la ronda con el algoritmo de Fleury.
(function () {
  var NODOS = [
    { id: "en", nombre: "Entrada", x: 90, y: 235 },
    { id: "ve", nombre: "Vestíbulo", x: 260, y: 95 },
    { id: "sa", nombre: "Salón", x: 460, y: 55 },
    { id: "bi", nombre: "Biblioteca", x: 665, y: 110 },
    { id: "co", nombre: "Comedor", x: 665, y: 360 },
    { id: "bo", nombre: "Bodega", x: 460, y: 415 },
    { id: "of", nombre: "Oficina del Merovingio", lineas: ["Oficina del", "Merovingio"], x: 260, y: 375 }
  ];
  // En el mismo orden que la tabla del enunciado.
  var ARISTAS = [
    { a: "en", b: "ve" }, { a: "ve", b: "sa" }, { a: "sa", b: "bi" }, { a: "bi", b: "co" },
    { a: "co", b: "bo" }, { a: "bo", b: "of" }, { a: "of", b: "en" }, { a: "ve", b: "co" }
  ];
  var NOMBRE = {};
  NODOS.forEach(function (n) { NOMBRE[n.id] = n.nombre; });
  var nom = function (id) { return NOMBRE[id]; };
  var b = function (id) { return "<strong>" + Viz.esc(NOMBRE[id]) + "</strong>"; };
  var idA = function (x, y) { return Viz.id(x, y, false); };
  var pasillo = function (x, y) { return Viz.esc(nom(x)) + "–" + Viz.esc(nom(y)); };

  function resolver() {
    var ady = Viz.adyacencia(NODOS, ARISTAS, false);
    var grado = {}, estado = {}, aristas = {}, etiquetas = {}, usada = {};
    var pasos = [], ronda = [], impares = [], fase = "", u = null;
    NODOS.forEach(function (n) { grado[n.id] = 0; estado[n.id] = ""; });

    var sinUsar = function (x) { return ady[x].filter(function (y) { return !usada[idA(x, y)]; }); };

    // ¿Es puente la arista x–y entre las que quedan sin usar? Lo es si, sacándola, y deja de poder llegar a x.
    function esPuente(x, y) {
      usada[idA(x, y)] = true;
      var vistos = {}, porVisitar = [y];
      vistos[y] = true;
      while (porVisitar.length) {
        var v = porVisitar.pop();
        sinUsar(v).forEach(function (z) { if (!vistos[z]) { vistos[z] = true; porVisitar.push(z); } });
      }
      delete usada[idA(x, y)];
      return !vistos[x];
    }

    function panelesGrados(resaltar) {
      return [{
        titulo: "Grado de cada habitación",
        html: "<table><thead><tr><th>Habitación</th><th>Grado</th><th>Paridad</th></tr></thead><tbody>" + NODOS.map(function (n) {
          var cls = resaltar && resaltar.indexOf(n.id) !== -1 ? ' class="resaltada"' : "";
          return "<tr" + cls + "><td>" + Viz.esc(n.nombre) + "</td><td>" + grado[n.id] + "</td><td>" + (grado[n.id] % 2 ? "<strong>impar</strong>" : "par") + "</td></tr>";
        }).join("") + "</tbody></table>"
      }];
    }

    function panelesRonda() {
      var usados = Object.keys(usada).length;
      return [
        { titulo: "Ronda de Seraph", html: ronda.length ? '<div class="fichas">' + ronda.map(function (x, k) {
            return (k ? '<span class="flecha-fichas">→</span>' : "") + '<span class="ficha ' + (k === ronda.length - 1 ? "f-activa" : "f-ok") + '">' + Viz.esc(nom(x)) + "</span>";
          }).join("") + "</div>" : '<span class="vacio">todavía no empezó</span>' },
        { titulo: "Pasillos usados: " + usados + " de " + ARISTAS.length, html: "<table><thead><tr><th>Habitación</th><th>Pasillos sin usar</th></tr></thead><tbody>" + NODOS.map(function (n) {
            var cls = n.id === u ? ' class="resaltada"' : "";
            var resto = sinUsar(n.id);
            return "<tr" + cls + "><td>" + Viz.esc(n.nombre) + "</td><td>" + (resto.length ? resto.map(function (y) { return Viz.esc(nom(y)); }).join(", ") : "–") + "</td></tr>";
          }).join("") + "</tbody></table>" }
      ];
    }

    function foto(titulo, texto, linea, extra) {
      var insignias = {};
      NODOS.forEach(function (n) {
        var valor = fase === "ronda" ? sinUsar(n.id).length : grado[n.id];
        if (fase === "ronda" || grado[n.id] > 0) insignias[n.id] = String(valor);
      });
      var p = {
        fase: fase === "ronda" ? "Parte 2 · Construir la ronda (Fleury)" : "Parte 1 · Criterio de Euler",
        titulo: titulo, texto: texto, linea: linea,
        nodos: Viz.copia(estado), insignias: insignias, aristas: Viz.copia(aristas), etiquetas: Viz.copia(etiquetas),
        paneles: fase === "ronda" ? panelesRonda() : panelesGrados()
      };
      if (extra) extra(p);
      pasos.push(p);
    }

    // ---------- Parte 1: grados ----------
    fase = "grados";
    foto("Todos los grados en 0",
      "El grado de una habitación es la cantidad de pasillos que la tocan. Para calcularlo alcanza con recorrer la lista de pasillos una vez y sumarle 1 a cada extremo.",
      1);

    ARISTAS.forEach(function (e, k) {
      grado[e.a]++; grado[e.b]++;
      aristas[idA(e.a, e.b)] = "actual";
      foto("Pasillo " + (k + 1) + " de " + ARISTAS.length + ": " + nom(e.a) + "–" + nom(e.b),
        "Cada pasillo suma 1 al grado de sus dos extremos: " + b(e.a) + " pasa a " + grado[e.a] + " y " + b(e.b) + " pasa a " + grado[e.b] + ".",
        [2, 3], function (p) { p.paneles = panelesGrados([e.a, e.b]); });
      aristas[idA(e.a, e.b)] = "";
    });

    impares = NODOS.filter(function (n) { return grado[n.id] % 2; }).map(function (n) { return n.id; });
    impares.forEach(function (x) { estado[x] = "espera"; });
    foto("Habitaciones de grado impar",
      "Hay exactamente " + impares.length + " habitaciones de grado impar: " + impares.map(b).join(" y ") + ". Todas las demás tienen grado par.",
      4, function (p) { p.paneles = panelesGrados(impares); });

    foto("Diagnóstico: hay camino euleriano",
      "Con exactamente 2 vértices impares (y todos los pasillos en una misma componente) existe un <strong>camino euleriano</strong>, pero no un circuito: "
        + "la ronda tiene que empezar en una de esas dos habitaciones y terminar, necesariamente, en la otra. Contar los grados cuesta O(V + E), pero solo dice <em>que</em> la ronda existe, no cómo armarla.",
      5, function (p) {
        p.paneles = panelesGrados(impares).concat([{ titulo: "Criterio de Euler", html:
          "<table><tbody><tr><td>0 impares</td><td>circuito euleriano</td></tr><tr class=\"resaltada\"><td>2 impares</td><td>camino euleriano</td></tr><tr><td>más de 2</td><td>ninguna ronda</td></tr></tbody></table>" }]);
      });

    // ---------- Parte 2: Fleury ----------
    fase = "ronda";
    u = impares.length ? impares[0] : NODOS[0].id;
    var destino = impares.length ? impares[1] : u;
    ronda.push(u);
    estado[u] = "activo";
    foto("Seraph empieza en " + nom(u),
      "Para construir la ronda hace falta algo más que los grados: en cada habitación hay que elegir un pasillo sin usar que no deje aislado un tramo pendiente, es decir, que no sea un <strong>puente</strong> (salvo que sea el único que queda). "
        + "Desde ahora, el número sobre cada habitación es la cantidad de pasillos sin usar que le quedan.",
      6);

    var paso = 0;
    while (sinUsar(u).length) {
      var candidatos = sinUsar(u);
      var elegido = null;
      for (var k = 0; k < candidatos.length && !elegido; k++) {
        var w = candidatos[k];
        if (candidatos.length === 1) { elegido = { w: w, motivo: "unico" }; break; }
        if (esPuente(u, w)) {
          var idP = idA(u, w);
          aristas[idP] = "retroceso";
          foto("Se descarta " + nom(u) + "–" + nom(w),
            "El pasillo " + pasillo(u, w) + " es un puente: si Seraph lo usa ahora, quedan pasillos a los que no podría volver. Como hay otras opciones, se descarta.",
            [8, 9]);
          aristas[idP] = "";
        } else {
          elegido = { w: w, motivo: "no-puente" };
        }
      }
      var v = elegido.w;
      var id = idA(u, v);
      var opciones = candidatos.map(function (x) { return Viz.esc(nom(x)); }).join(", ");
      var motivo = elegido.motivo === "unico"
        ? "Desde " + b(u) + " queda un solo pasillo sin usar, hacia " + b(v) + ": se usa ese (aunque fuera puente, no hay alternativa)."
        : "Desde " + b(u) + " quedan " + candidatos.length + " pasillos sin usar (hacia " + opciones + "). " + pasillo(u, v) + " no es puente: si se usa, todos los pasillos que faltan siguen conectados entre sí. Seraph lo recorre.";
      usada[id] = true;
      paso++;
      aristas[id] = "usada";
      etiquetas[id] = String(paso);
      estado[u] = sinUsar(u).length ? "" : "hecho";
      if (u === destino && sinUsar(u).length) estado[u] = "espera";
      u = v;
      ronda.push(u);
      estado[u] = "activo";
      foto("Paso " + paso + ": " + nom(ronda[ronda.length - 2]) + " → " + nom(u),
        motivo,
        elegido.motivo === "unico" ? [7, 9, 10, 11] : [7, 8, 10, 11],
        function (p) { p.aristas[id] = "actual"; });
    }

    estado[u] = "hecho";
    foto("Ronda completa",
      "Seraph recorrió los " + ARISTAS.length + " pasillos exactamente una vez: " + ronda.map(function (x) { return Viz.esc(nom(x)); }).join(" → ") + ". "
        + "Empezó en " + b(ronda[0]) + " y terminó en " + b(u) + ", las dos habitaciones de grado impar. Pasó dos veces por el Vestíbulo, y eso está permitido: lo que no se puede repetir es el pasillo.",
      7);

    return { pasos: pasos, resultado: { grado: grado, impares: impares, ronda: ronda } };
  }

  window.EJERCICIO = {
    titulo: "La Ronda de Seraph",
    intro: "Resolución paso a paso de los puntos 2 y 3: primero se cuentan los grados para aplicar el criterio de Euler, y después se construye la ronda eligiendo en cada habitación un pasillo que no sea puente (algoritmo de Fleury).",
    volver: "../../senderos/bestias/recorrido/la-ronda-de-seraph",
    vista: "0 0 760 470",
    dirigido: false,
    nodos: NODOS,
    aristas: ARISTAS,
    leyenda: [
      { texto: "Grado impar (inicio o fin)", borde: "var(--warn)", fondo: "var(--warn-bg)" },
      { texto: "Donde está Seraph", borde: "var(--secondary)", fondo: "var(--active-bg)" },
      { texto: "Sin pasillos pendientes", borde: "var(--tertiary)", fondo: "var(--done-bg)" },
      { tipo: "arista", texto: "Pasillo usado (con su orden)", color: "var(--tertiary)" },
      { tipo: "arista", texto: "Pasillo que se cuenta o se recorre", color: "var(--warn)" },
      { tipo: "arista", texto: "Puente descartado", color: "var(--alert)", punteada: true }
    ],
    pseudocodigo: [
      "para cada v: grado[v] ← 0",
      "para cada pasillo (a, b):",
      "    grado[a] ← grado[a] + 1; grado[b] ← grado[b] + 1",
      "impares ← habitaciones de grado impar",
      "0 impares: circuito · 2: camino · más: ninguno",
      "u ← un impar (o cualquiera si no hay)",
      "mientras u tenga pasillos sin usar:",
      "    elegir u–w sin usar que no sea puente",
      "        (un puente solo si es el único que queda)",
      "    marcar u–w como usado; agregar w a la ronda",
      "    u ← w"
    ],
    escenarios: [{ id: "base", nombre: "Ronda de Seraph", resolver: resolver }]
  };
})();
</script>
<script>
(function () {
  "use strict";
  var E = window.EJERCICIO;
  var NS = "http://www.w3.org/2000/svg";
  var W = 136, H = 48; // tamaño de cada nodo
  var $ = function (id) { return document.getElementById(id); };

  var nombre = {};
  E.nodos.forEach(function (n) { nombre[n.id] = n.nombre; });

  var escenario = 0, pasos = [], i = 0, temporizador = null;
  var refNodo = {}, refInsignia = {}, refArista = {}, refEtiqueta = {};

  $("titulo").textContent = E.titulo;
  $("intro").innerHTML = E.intro;
  $("volver").href = E.volver;
  $("grafo-desc").textContent = "Grafo del ejercicio " + E.titulo;

  // Leyenda
  $("leyenda").innerHTML = E.leyenda.map(function (l) {
    var estilo = l.tipo === "arista"
      ? '<i class="muestra-linea" style="border-color:' + l.color + (l.punteada ? ";border-top-style:dashed" : "") + '"></i>'
      : '<i class="muestra" style="border-color:' + l.borde + ";background:" + l.fondo + '"></i>';
    return "<span>" + estilo + Viz.esc(l.texto) + "</span>";
  }).join("");

  // Pseudocódigo
  $("pseudo").innerHTML = E.pseudocodigo.map(function (linea, k) {
    if (linea.charAt(0) === "#") return '<li class="titulo">' + Viz.esc(linea.slice(1).trim()) + "</li>";
    return '<li data-linea="' + (k + 1) + '"><span class="num">' + (k + 1) + "</span>" + Viz.esc(linea) + "</li>";
  }).join("");

  // Escenarios
  if (E.escenarios.length > 1) {
    var cont = $("escenarios");
    cont.hidden = false;
    E.escenarios.forEach(function (esc, k) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = esc.nombre;
      b.setAttribute("aria-pressed", k === 0 ? "true" : "false");
      b.addEventListener("click", function () { cargarEscenario(k); });
      cont.appendChild(b);
    });
  }

  function el(tag, attrs, padre) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (padre) padre.appendChild(e);
    return e;
  }

  // Punto del borde del rectángulo del nodo en dirección (dx, dy).
  function borde(n, dx, dy, margen) {
    var len = Math.hypot(dx, dy) || 1;
    var ux = dx / len, uy = dy / len;
    var t = Math.min(ux ? (W / 2) / Math.abs(ux) : Infinity, uy ? (H / 2) / Math.abs(uy) : Infinity);
    return { x: n.x + ux * (t + margen), y: n.y + uy * (t + margen) };
  }

  function dibujarGrafo() {
    var svg = $("grafo");
    while (svg.childNodes.length > 1) svg.removeChild(svg.lastChild);
    svg.setAttribute("viewBox", E.vista);
    refNodo = {}; refInsignia = {}; refArista = {}; refEtiqueta = {};
    var nodoPorId = {};
    E.nodos.forEach(function (n) { nodoPorId[n.id] = n; });

    var defs = el("defs", {}, svg);
    ["", "e-arbol", "e-actual", "e-retroceso", "e-ciclo", "e-usada"].forEach(function (c) {
      var m = el("marker", { id: "flecha-" + (c || "base"), viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse", markerUnits: "userSpaceOnUse" }, defs);
      m.setAttribute("markerWidth", "11");
      m.setAttribute("markerHeight", "11");
      el("path", { d: "M0,0 L10,5 L0,10 z", "class": "marca " + (c ? "marca-" + c : "") }, m);
    });

    (E.zonas || []).forEach(function (z) {
      var g = el("g", { "class": "zona" }, svg);
      el("rect", { x: z.x, y: z.y, width: z.w, height: z.h, rx: 12 }, g);
      var t = el("text", { x: z.x + 10, y: z.y + 16 }, g);
      t.textContent = z.texto;
    });

    var capaAristas = el("g", {}, svg);
    var capaEtiquetas = el("g", {}, svg);
    var esc = E.escenarios[escenario];
    E.aristas.forEach(function (a) {
      if (a.escenario && a.escenario !== esc.id) return;
      var A = nodoPorId[a.a], B = nodoPorId[a.b];
      var id = Viz.id(a.a, a.b, E.dirigido);
      var d, medio;
      if (a.curva) {
        var c = a.curva;
        var p1 = borde(A, c.x - A.x, c.y - A.y, 0);
        var p2 = borde(B, c.x - B.x, c.y - B.y, E.dirigido ? 3 : 0);
        d = "M" + p1.x + "," + p1.y + " Q" + c.x + "," + c.y + " " + p2.x + "," + p2.y;
        medio = { x: 0.25 * p1.x + 0.5 * c.x + 0.25 * p2.x, y: 0.25 * p1.y + 0.5 * c.y + 0.25 * p2.y };
      } else {
        var q1 = borde(A, B.x - A.x, B.y - A.y, 0);
        var q2 = borde(B, A.x - B.x, A.y - B.y, E.dirigido ? 3 : 0);
        d = "M" + q1.x + "," + q1.y + " L" + q2.x + "," + q2.y;
        medio = { x: (q1.x + q2.x) / 2, y: (q1.y + q2.y) / 2 };
      }
      var p = el("path", { d: d, "class": "arista" }, capaAristas);
      if (E.dirigido) p.setAttribute("marker-end", "url(#flecha-base)");
      var t = el("title", {}, p);
      t.textContent = nombre[a.a] + (E.dirigido ? " → " : " – ") + nombre[a.b];
      refArista[id] = p;
      var g = el("g", { "class": "arista-etiqueta", visibility: "hidden" }, capaEtiquetas);
      el("circle", { cx: medio.x, cy: medio.y, r: 11 }, g);
      var tx = el("text", { x: medio.x, y: medio.y }, g);
      refEtiqueta[id] = { g: g, t: tx };
    });

    var capaNodos = el("g", {}, svg);
    E.nodos.forEach(function (n) {
      var g = el("g", { "class": "nodo" + (n.aislado ? " aislado" : "") }, capaNodos);
      el("rect", { x: n.x - W / 2, y: n.y - H / 2, width: W, height: H, rx: 12 }, g);
      var lineas = n.lineas || [n.nombre];
      lineas.forEach(function (l, k) {
        var t = el("text", { x: n.x, y: n.y + (k - (lineas.length - 1) / 2) * 15 }, g);
        t.textContent = l;
      });
      var ins = el("g", { "class": "insignia", visibility: "hidden" }, g);
      el("circle", { cx: n.x + W / 2 - 4, cy: n.y - H / 2 + 2, r: 12 }, ins);
      var it = el("text", { x: n.x + W / 2 - 4, y: n.y - H / 2 + 2 }, ins);
      refNodo[n.id] = g;
      refInsignia[n.id] = { g: ins, t: it };
    });
  }

  function render() {
    var p = pasos[i];
    E.nodos.forEach(function (n) {
      var estado = (p.nodos && p.nodos[n.id]) || "";
      refNodo[n.id].setAttribute("class", "nodo" + (n.aislado ? " aislado" : "") + (estado ? " n-" + estado : ""));
      var ins = p.insignias && p.insignias[n.id];
      var r = refInsignia[n.id];
      if (ins !== undefined && ins !== null && ins !== "") { r.t.textContent = ins; r.g.setAttribute("visibility", "visible"); }
      else r.g.setAttribute("visibility", "hidden");
    });
    Object.keys(refArista).forEach(function (id) {
      var estado = (p.aristas && p.aristas[id]) || "";
      var path = refArista[id];
      path.setAttribute("class", "arista" + (estado ? " e-" + estado : ""));
      if (E.dirigido) path.setAttribute("marker-end", "url(#flecha-" + (estado && estado !== "tenue" ? "e-" + estado : "base") + ")");
      var et = p.etiquetas && p.etiquetas[id];
      var r = refEtiqueta[id];
      if (et) { r.t.textContent = et; r.g.setAttribute("visibility", "visible"); }
      else r.g.setAttribute("visibility", "hidden");
    });

    $("fase").textContent = p.fase || "";
    $("paso-titulo").textContent = p.titulo;
    $("paso-texto").innerHTML = p.texto;
    $("paneles").innerHTML = (p.paneles || []).map(function (pn) {
      return '<section class="tarjeta panel"><h3>' + Viz.esc(pn.titulo) + "</h3>" + pn.html + "</section>";
    }).join("");
    var lineas = [].concat(p.linea || []);
    Array.prototype.forEach.call($("pseudo").children, function (li) {
      var n = Number(li.getAttribute("data-linea"));
      li.classList.toggle("actual", lineas.indexOf(n) !== -1);
    });

    $("contador").textContent = "Paso " + (i + 1) + " de " + pasos.length;
    $("barra").max = pasos.length - 1;
    $("barra").value = i;
    $("btn-inicio").disabled = $("btn-ant").disabled = i === 0;
    $("btn-sig").disabled = i === pasos.length - 1;
    if (i === pasos.length - 1) pausar();
  }

  function ir(k) { i = Math.max(0, Math.min(pasos.length - 1, k)); render(); }
  function pausar() {
    if (temporizador) clearInterval(temporizador);
    temporizador = null;
    $("btn-play").textContent = i === pasos.length - 1 ? "↺ Repetir" : "▶ Reproducir";
  }
  function reproducir() {
    if (i === pasos.length - 1) ir(0);
    $("btn-play").textContent = "⏸ Pausar";
    temporizador = setInterval(function () { ir(i + 1); }, Number($("velocidad").value));
  }
  function alternar() { temporizador ? pausar() : reproducir(); }

  function cargarEscenario(k) {
    pausar();
    escenario = k;
    Array.prototype.forEach.call($("escenarios").children, function (b, j) { b.setAttribute("aria-pressed", j === k ? "true" : "false"); });
    pasos = E.escenarios[k].resolver().pasos;
    dibujarGrafo();
    ir(0);
    pausar();
  }

  $("btn-inicio").addEventListener("click", function () { pausar(); ir(0); });
  $("btn-ant").addEventListener("click", function () { pausar(); ir(i - 1); });
  $("btn-sig").addEventListener("click", function () { pausar(); ir(i + 1); });
  $("btn-play").addEventListener("click", alternar);
  $("barra").addEventListener("input", function (e) { pausar(); ir(Number(e.target.value)); });
  $("velocidad").addEventListener("change", function () { if (temporizador) { pausar(); reproducir(); } });
  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "select" || tag === "input" || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight") { pausar(); ir(i + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { pausar(); ir(i - 1); e.preventDefault(); }
    else if (e.key === "Home") { pausar(); ir(0); e.preventDefault(); }
    else if (e.key === "End") { pausar(); ir(pasos.length - 1); e.preventDefault(); }
    else if (e.key === " " && tag !== "button") { alternar(); e.preventDefault(); }
  });
  window.addEventListener("storage", function (e) {
    if (e.key === "theme" && e.newValue) document.documentElement.setAttribute("saved-theme", e.newValue);
  });

  cargarEscenario(0);
  window.addEventListener("load", function () { window.scrollTo(0, 0); });
})();
</script>
</body>
</html>
